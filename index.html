<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routine</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      color: #111;
    }
    button, input, select {
      font: inherit;
    }
    button {
      cursor: pointer;
    }
    .hidden {
      display: none !important;
    }

    /* =========================
       APP CONTAINER
    ========================= */
    .container {
      width: 92%;
      max-width: 900px;
      margin: auto;
      padding: 10px 0 60px; /* צמצום מרווח עליון כדי להעלות את האתר למעלה */
    }

    /* =========================
       HEADER (מוקטן ומוזז לשמאל)
    ========================= */
    header {
      background: white;
      padding: 10px 15px; /* פדינג קטן ורזה */
      border-radius: 16px;
      margin-bottom: 12px; /* מרווח קטן כדי ששאר האתר יעלה למעלה */
      display: flex;
      flex-direction: row-reverse; /* הופך את הסדר ומציב את המידע לשמאל */
      justify-content: space-between; 
      align-items: center;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: right;
    }
    header h1 {
      margin: 0;
      font-size: 22px; /* כותרת Routine מוקטנת */
    }
    #userInfo {
      color: #666;
      font-size: 13px; /* שם משתמש קטן */
      margin: 0;
    }
    .logout-btn {
      padding: 6px 14px; /* כפתור התנתק קטן ונקי */
      border: 1px solid #ddd;
      background: white;
      border-radius: 10px;
      font-size: 13px;
    }

    /* =========================
       CARDS & MAIN CONTENT
    ========================= */
    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    .top-row h2 {
      margin: 0;
    }
    .primary-btn {
      background: #111;
      color: white;
      border: 0;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
    }

    /* =========================
       ACTIVE ROUTINE (מסך הצעדים המוגדל)
    ========================= */
    #activeScreen {
      min-height: 75vh;
      padding: 20px 15px;
      cursor: pointer; /* הופך את כל המסך לאינדיקציה של לחיץ */
      display: none; /* יוצג רק כשיתחילו רוטינה */
    }
    .active-box {
      max-width: 600px;
      margin: auto;
      background: white;
      border-radius: 25px;
      padding: 40px 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    
    /* הגדלה משמעותית של ה-Steps */
    #activeStepName {
      font-size: 58px; /* גופן ענק לצעד הנוכחי */
      font-weight: bold;
      color: #d00;
      margin: 20px 0;
      line-height: 1.2;
    }
    /* הגדלת הטיימר שיתאים לגודל הצעד */
    #timer {
      font-size: 85px; /* טיימר ענק וברור */
      font-weight: bold;
      margin-bottom: 25px;
      color: #111;
    }
    
    .instruction-text {
      color: #666; 
      font-size: 16px;
      margin-bottom: 20px;
    }
    .back-btn {
      padding: 12px;
      width: 100%;
      background: #f5f5f7;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container" id="app">
    
    <!-- ה-Header החדש והמעודכן: קטן, מוזז לשמאל ומעלה את האתר למעלה -->
    <header id="mainHeader">
      <button class="logout-btn" onclick="alert('מתנתק...')">התנתק</button>
      <div class="header-right">
        <h1>Routine</h1>
        <div id="userInfo">יוסף בן חיים</div>
      </div>
    </header>

    <!-- מסך ראשי: רשימת רוטינות וכפתור הפעלה -->
    <div id="mainDashboard" class="card">
      <div class="top-row">
        <h2>הרוטינות שלי</h2>
        <button class="primary-btn" onclick="startRoutine()">הפעל רוטינת בוקר</button>
      </div>
      <p style="color: #666; margin-top: 15px;">לחץ על כפתור "הפעל רוטינת בוקר" כדי להתחיל את מסך הצעדים החדש.</p>
    </div>

    <!-- מסך הצעד הפעיל - מוגדל ולחיץ בכל מקום על המסך -->
    <div id="activeScreen">
      <div class="active-box">
        <div id="activeStepName">טוען צעד...</div>
        <div id="timer">00:00</div>
        <p class="instruction-text">🎯 נגע בכל מקום על המסך כדי לסמן כבוצע ולעבור לצעד הבא</p>
        
        <button class="back-btn" id="cancelBtn">ביטול וחזרה לתפריט</button>
      </div>
    </div>

  </div>

  <script>
    // נתוני דוגמה לצעדים של הרוטינה
    const routineSteps = [
      { name: "צעד 1: שטיפת פנים", duration: 30 },   // 30 שניות
      { name: "צעד 2: צחצוח שיניים", duration: 120 }, // 2 דקות
      { name: "צעד 3: שתיית מים", duration: 15 },    // 15 שניות
      { name: "צעד 4: לבישת בגדים", duration: 180 }  // 3 דקות
    ];

    let currentStepIndex = 0;
    let timerInterval = null;
    let timeLeft = 0;

    // פונקציה להפעלת הרוטינה ומעבר למסך הפעיל
    function startRoutine() {
      currentStepIndex = 0;
      document.getElementById('mainDashboard').classList.add('hidden');
      document.getElementById('mainHeader').classList.add('hidden'); // מחביא את ההדר בזמן עבודה למקסימום פוקוס
      document.getElementById('activeScreen').style.display = 'block';
      loadStep();
    }

    // פונקציה לטעינת צעד ספציפי ועדכון הטיימר שלו
    function loadStep() {
      if (currentStepIndex >= routineSteps.length) {
        endRoutine();
        return;
      }

      const currentStep = routineSteps[currentStepIndex];
      document.getElementById('activeStepName').innerText = currentStep.name;
      timeLeft = currentStep.duration;
      updateTimerDisplay();

      // איפוס והפעלה מחדש של הטיימר
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateTimerDisplay();
        } else {
          // אם הזמן נגמר, עובר אוטומטית לצעד הבא
          nextStep();
        }
      }, 1000);
    }

    // עדכון תצוגת הזמן בפורמט MM:SS
    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const seconds = (timeLeft % 60).toString().padStart(2, '0');
      document.getElementById('timer').innerText = `${minutes}:${seconds}`;
    }

    // מעבר לצעד הבא
    function nextStep() {
      currentStepIndex++;
      loadStep();
    }

    // סיום הרוטינה בהצלחה
    function endRoutine() {
      clearInterval(timerInterval);
      alert("🏆 כל הכבוד! סיימת את הרוטינה בהצלחה!");
      resetToDashboard();
    }

    // חזרה למסך הראשי
    function resetToDashboard() {
      clearInterval(timerInterval);
      document.getElementById('activeScreen').style.display = 'none';
      document.getElementById('mainDashboard').classList.remove('hidden');
      document.getElementById('mainHeader').classList.remove('hidden');
    }

    /* ========================================================
       הלוגיקה החדשה: לחיצה על כל מקום במסך הפעיל מסמנת כבוצע
    ======================================================== */
    document.getElementById('activeScreen').addEventListener('click', function(e) {
      // אם המשתמש לחץ על כפתור הביטול, אנחנו עוצרים ולא עוברים לצעד הבא
      if (e.target.id === 'cancelBtn') {
        return;
      }
      
      // מפעיל את הצעד הבא בכל לחיצה אחרת על פני כל המסך
      nextStep();
    });

    // חיבור כפתור הביטול לחזרה לתפריט
    document.getElementById('cancelBtn').addEventListener('click', function() {
      if (confirm("האם אתה בטוח שברצונך להפסיק את הרוטינה?")) {
        resetToDashboard();
      }
    });
  </script>

</body>
</html>
