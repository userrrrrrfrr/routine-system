/* =========================
   IMAGE COMPRESSION (נשאר)
========================= */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = event => {
      const img = new Image();
      img.onload = () => {
        const maxWidth = 900;
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = height * maxWidth / width;
          width = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.65));
      };
      img.onerror = reject;
      img.src = event.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* =========================
   UPLOAD TO STORAGE (חדש)
========================= */
async function uploadImage(base64, path) {
  if (!base64 || !base64.startsWith("data:")) {
    return base64; // כבר URL
  }
  const storageRef = ref(storage, path);
  await uploadString(storageRef, base64, "data_url");
  return await getDownloadURL(storageRef);
}

/* =========================
   SAVE ROUTINE – החלק החשוב שהשתנה
========================= */
document.getElementById("saveRoutineBtn").addEventListener("click", saveRoutine);

async function saveRoutine() {
  const name = document.getElementById("routineName").value.trim();
  if (!name) {
    alert("כתוב שם ל-Routine.");
    return;
  }

  const days = [...document.querySelectorAll(".days input:checked")]
    .map(box => Number(box.value));

  const stepElements = document.querySelectorAll(".step");
  const stepsData = [];

  // קודם אוספים את כל הנתונים (בלי להעלות עדיין)
  for (let index = 0; index < stepElements.length; index++) {
    const div = stepElements[index];
    const stepName = div.querySelector(".step-name").value.trim();
    if (!stepName) {
      alert(`כתוב שם ל-Step ${index + 1}.`);
      return;
    }

    const duration = Number(div.querySelector(".step-duration").value);
    let finalFrequency = div.querySelector(".frequency").value;
    if (finalFrequency === "custom") {
      finalFrequency = div.querySelector(".custom-value").value;
    }
    const startDate = div.querySelector(".step-start-date-input").value;
    if (!startDate) {
      alert(`בחר תאריך התחלה ל-Step ${index + 1}.`);
      return;
    }
    const numericFrequency = Number(finalFrequency);
    if (!numericFrequency || numericFrequency < 1) {
      alert(`התדירות של Step ${index + 1} אינה תקינה.`);
      return;
    }

    stepsData.push({
      name: stepName,
      duration: duration > 0 ? duration : 60,
      frequency: numericFrequency,
      startDate,
      order: index,
      tempImage: stepImages.get(div.dataset.stepId) || "",
      stepId: div.dataset.stepId
    });
  }

  // כפתור שמור – ננעל כדי למנוע לחיצות כפולות
  const saveBtn = document.getElementById("saveRoutineBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "שומר...";

  try {
    // 1. מעלים את תמונת ה-Routine (אם יש)
    let routineImageUrl = currentRoutineImage;
    if (currentRoutineImage && currentRoutineImage.startsWith("data:")) {
      const path = `users/${currentUser.uid}/routines/${crypto.randomUUID()}.jpg`;
      routineImageUrl = await uploadImage(currentRoutineImage, path);
    }

    // 2. מעלים תמונות של ה-Steps
    const steps = [];
    for (const s of stepsData) {
      let imageUrl = s.tempImage;
      if (s.tempImage && s.tempImage.startsWith("data:")) {
        const path = `users/${currentUser.uid}/steps/${s.stepId}.jpg`;
        imageUrl = await uploadImage(s.tempImage, path);
      }
      steps.push({
        name: s.name,
        image: imageUrl || "",
        duration: s.duration,
        frequency: s.frequency,
        startDate: s.startDate,
        order: s.order
      });
    }

    const data = {
      name,
      image: routineImageUrl || "",
      days,
      steps,
      updatedAt: new Date().toISOString()
    };

    const refCol = collection(db, "users", currentUser.uid, "routines");

    if (editingRoutineId) {
      await updateDoc(
        doc(db, "users", currentUser.uid, "routines", editingRoutineId),
        data
      );
    } else {
      await addDoc(refCol, data);
    }

    closeEditor();
    await loadRoutines();
    alert("ה-Routine נשמר!");
  } catch (error) {
    console.error(error);
    alert("השמירה נכשלה:\n\n" + error.message);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "שמור";
  }
}
