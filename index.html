<!DOCTYPE html>

<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routine</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      color: #111;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 40px 30px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.08);
    }

    .login-box h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }

    .login-box p {
      color: #666;
      margin-bottom: 30px;
    }

    .google-btn {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: white;
    }

    /* =========================
       APP
    ========================= */

    #app {
      display: none;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: auto;
      padding: 12px 0 60px;
    }

    /* =========================
       USER SIDE PANEL
    ========================= */

    .user-tab {
      position: fixed;
      top: 18px;
      left: 0;
      z-index: 1000;

      background: white;
      border: 1px solid #e5e5e5;
      border-left: 0;

      border-radius: 0 14px 14px 0;
      padding: 9px 12px;

      box-shadow: 0 4px 18px rgba(0,0,0,.08);

      display: flex;
      align-items: center;
      gap: 7px;

      font-size: 13px;
      color: #555;

      transition: transform .25s ease;
    }

    .user-tab-icon {
      font-size: 16px;
    }

    .user-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      max-width: 80vw;
      height: 100vh;

      background: white;
      z-index: 1001;

      box-shadow: 8px 0 30px rgba(0,0,0,.12);

      transform: translateX(-100%);
      transition: transform .28s ease;

      padding: 25px 20px;

      display: flex;
      flex-direction: column;
    }

    .user-panel.open {
      transform: translateX(0);
    }

    .user-panel-close {
      width: 36px;
      height: 36px;

      border: 0;
      background: #f5f5f7;

      border-radius: 10px;

      font-size: 20px;

      margin-bottom: 30px;
    }

    .user-panel-title {
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }

    #panelUserInfo {
      font-size: 16px;
      font-weight: 600;
      word-break: break-word;
      margin-bottom: 30px;
    }

    .panel-logout {
      width: 100%;
      padding: 13px;

      border: 1px solid #ddd;
      background: white;

      border-radius: 12px;

      color: #d00;
    }

    .user-panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.18);

      z-index: 1000;

      display: none;
    }

    .user-panel-overlay.show {
      display: block;
    }

    /* =========================
       MAIN HEADER
    ========================= */

    .main-title {
      background: white;
      padding: 18px 20px;
      border-radius: 20px;
      margin-bottom: 16px;
      text-align: center;
    }

    .main-title h1 {
      margin: 0;
      font-size: 30px;
    }

    /* =========================
       CARDS
    ========================= */

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .top-row h2 {
      margin: 0;
    }

    .primary {
      background: #111;
      color: white;
      border: 0;
      padding: 12px 18px;
      border-radius: 10px;
    }

    .secondary {
      background: white;
      border: 1px solid #ddd;
      padding: 10px 15px;
      border-radius: 10px;
    }

    .danger {
      color: #d00;
      background: white;
      border: 1px solid #ddd;
      padding: 10px 15px;
      border-radius: 10px;
    }

    /* =========================
       IMAGE UPLOAD
    ========================= */

    .image-upload {
      margin-top: 10px;
    }

    .image-upload label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .image-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
    }

    .image-preview {
      margin-top: 12px;
      position: relative;
    }

    .image-preview img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 15px;
      border: 1px solid #eee;
      display: block;
    }

    .remove-image {
      margin-top: 8px;
      padding: 8px 12px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 8px;
      color: #d00;
    }

    .routine-image {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 15px;
      display: block;
    }

    .direct-routine-image {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    /* =========================
       ROUTINES
    ========================= */

    .routine-card {
      border: 1px solid #eee;
      border-radius: 15px;
      padding: 18px;
      margin-top: 12px;
    }

    .routine-card h3 {
      margin: 0 0 7px;
    }

    .routine-info {
      color: #777;
      font-size: 14px;
      margin-bottom: 15px;
      line-height: 1.7;
    }

    .today-info {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: #f5f5f7;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 35px 10px;
    }

    /* =========================
       FORM
    ========================= */

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
    }

    .days {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .day input {
      display: none;
    }

    .day span {
      display: block;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
    }

    .day input:checked + span {
      background: #111;
      color: white;
    }

    /* =========================
       STEPS
    ========================= */

    .step {
      border: 1px solid #eee;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .step-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .step-grid {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 12px;
    }

    .custom-days {
      display: none;
      margin-top: 12px;
    }

    .step-start-date {
      margin-top: 15px;
    }

    .step-start-date label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .step-start-date small {
      display: block;
      color: #777;
      margin-top: 6px;
    }

    /* =========================
       ACTIVE ROUTINE
    ========================= */

    #activeScreen {
      display: none;
      min-height: auto;
      padding: 0;
    }

    .active-box {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      border-radius: 28px;
      padding: 16px 22px 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    #activeRoutineName {
      margin: 0 0 8px;
      font-size: 17px;
      font-weight: 600;
      color: #222;
      text-align: left;
      width: 100%;
    }

    .active-step-area {
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      transition: transform .12s ease, opacity .12s ease;
    }

    .active-step-area:active {
      transform: scale(.98);
      opacity: .85;
    }

    .active-step-image {
      width: 100%;
      max-height: 340px;
      object-fit: contain;
      border-radius: 18px;
      margin: 0 auto 6px;
      display: block;
      background: #fafafa;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }

    #activeStepName {
      font-size: 42px;
      font-weight: 800;
      color: #d00;
      margin: 8px 0 8px;
      line-height: 1.15;
      letter-spacing: -0.5px;
    }

    #timer {
      font-size: 58px;
      font-weight: 700;
      margin: 4px 0 18px;
      color: #111;
    }

    .tap-hint {
      font-size: 13px;
      color: #999;
      margin-bottom: 16px;
    }

    .back-btn {
      width: 100%;
      padding: 14px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      color: #333;
    }

    /* =========================
       DIRECT ROUTINE
    ========================= */

    #directRoutineScreen {
      display: none;
    }

    .direct-routine-box {
      max-width: 700px;
      margin: auto;
      background: white;
      border-radius: 25px;
      padding: 30px 25px;
    }

    .direct-routine-box h1 {
      margin-top: 0;
    }

    .direct-step {
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .direct-step-image {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 10px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      .container {
        width: 94%;
        padding-top: 10px;
      }

      .main-title {
        padding: 14px 18px;
        margin-bottom: 12px;
      }

      .main-title h1 {
        font-size: 27px;
      }

      .step-grid {
        grid-template-columns: 1fr;
      }

      #timer {
        font-size: 52px;
      }

      #activeStepName {
        font-size: 36px;
      }

      #activeRoutineName {
        font-size: 16px;
      }

      .active-step-image {
        max-height: 300px;
      }

      .top-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .user-tab {
        top: 12px;
        font-size: 12px;
        padding: 8px 10px;
      }

      .active-box {
        padding-top: 12px;
      }
    }
  </style>

</head>

<script type="module">

/* =========================
   FIREBASE IMPORTS
========================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyCGTJFidIrp_YAuKOg2CCEO-vjFCiakkHo",
  authDomain: "site-c224f.firebaseapp.com",
  projectId: "site-c224f",
  storageBucket: "site-c224f.firebasestorage.app",
  messagingSenderId: "709702843873",
  appId: "1:709702843873:web:a326854107acb20e6ee6a0",
  measurementId: "G-GC5LS15YEC"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();


/* =========================
   VARIABLES
========================= */

let currentUser = null;

let routines = [];

let editingRoutineId = null;

let activeRoutine = null;

let activeSteps = [];

let activeStepIndex = 0;

let timerInterval = null;

let remainingSeconds = 0;

let currentRoutineImage = "";

let stepImages = new Map();


/* =========================
   USER SIDE PANEL
========================= */

const userTab =
  document.getElementById("userTab");

const userPanel =
  document.getElementById("userPanel");

const userPanelOverlay =
  document.getElementById("userPanelOverlay");

const closeUserPanel =
  document.getElementById("closeUserPanel");

function openUserPanel() {

  userPanel.classList.add("open");

  userPanelOverlay.classList.add("show");

}

function closeUserPanelFunction() {

  userPanel.classList.remove("open");

  userPanelOverlay.classList.remove("show");

}

userTab.addEventListener(
  "click",
  openUserPanel
);

closeUserPanel.addEventListener(
  "click",
  closeUserPanelFunction
);

userPanelOverlay.addEventListener(
  "click",
  closeUserPanelFunction
);


/* =========================
   AUTH
========================= */

document
  .getElementById("loginBtn")
  .addEventListener("click", async () => {

    try {

      await signInWithPopup(
        auth,
        provider
      );

    } catch (error) {

      console.error(error);

      alert(
        "ההתחברות נכשלה:\n\n" +
        error.message
      );

    }

  });


document
  .getElementById("logoutBtn")
  .addEventListener("click", async () => {

    closeUserPanelFunction();

    await signOut(auth);

  });


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if (user) {

      currentUser = user;

      document
        .getElementById("loginScreen")
        .style.display = "none";

      document
        .getElementById("app")
        .style.display = "block";

      const userText =
        user.displayName ||
        user.email ||
        "";

      document
        .getElementById("panelUserInfo")
        .textContent = userText;

      await loadRoutines();

    } else {

      currentUser = null;

      document
        .getElementById("loginScreen")
        .style.display = "flex";

      document
        .getElementById("app")
        .style.display = "none";

    }

  }
);


/* =========================
   LOAD ROUTINES
========================= */

async function loadRoutines() {

  const list =
    document.getElementById("routineList");

  list.innerHTML = "טוען...";

  try {

    const ref =
      collection(
        db,
        "users",
        currentUser.uid,
        "routines"
      );

    const snapshot =
      await getDocs(ref);

    routines = [];

    snapshot.forEach(item => {

      routines.push({
        id: item.id,
        ...item.data()
      });

    });

    renderRoutines();

    openRoutineFromLink();

  } catch (error) {

    console.error(error);

    list.innerHTML = `
      <div class="empty">
        לא ניתן לטעון את השגרות.<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

  }

}


/* =========================
   RENDER ROUTINES
========================= */

function renderRoutines() {

  const list =
    document.getElementById("routineList");

  list.innerHTML = "";

  if (routines.length === 0) {

    list.innerHTML = `
      <div class="empty">
        עדיין אין לך שגרות.<br>
        לחץ על "+ Routine חדש".
      </div>
    `;

    return;

  }

  routines.forEach(routine => {

    const card =
      document.createElement("div");

    card.className =
      "routine-card";

    const todaySteps =
      getTodaySteps(routine);

    let imageHtml = "";

    if (routine.image) {

      imageHtml = `
        <img
          class="routine-image"
          src="${routine.image}"
          alt="">
      `;

    }

    card.innerHTML = `

      ${imageHtml}

      <h3>
        ${escapeHtml(routine.name)}
      </h3>

      <div class="routine-info">
        ${routine.steps?.length || 0} Steps
      </div>

      <div class="today-info">
        להיום:
        <strong>
          ${todaySteps.length}
        </strong>
        Steps
      </div>

      <div class="actions">

        <button class="primary start">
          התחל
        </button>

        <button class="secondary edit">
          ערוך
        </button>

        <button class="secondary share">
          🔗 העתק קישור
        </button>

        <button class="danger delete">
          מחק
        </button>

      </div>

    `;

    card
      .querySelector(".start")
      .addEventListener(
        "click",
        () => startRoutine(routine)
      );

    card
      .querySelector(".edit")
      .addEventListener(
        "click",
        () => openEditor(routine)
      );

    card
      .querySelector(".share")
      .addEventListener(
        "click",
        () => copyRoutineLink(routine.id)
      );

    card
      .querySelector(".delete")
      .addEventListener(
        "click",
        () => deleteRoutine(routine.id)
      );

    list.appendChild(card);

  });

}


/* =========================
   IMAGE COMPRESSION
========================= */

function compressImage(file) {

  return new Promise((resolve, reject) => {

    const reader =
      new FileReader();

    reader.onload = event => {

      const img =
        new Image();

      img.onload = () => {

        const maxWidth = 600;

        let width = img.width;

        let height = img.height;

        if (width > maxWidth) {

          height =
            Math.round(
              height * maxWidth / width
            );

          width = maxWidth;

        }

        const canvas =
          document.createElement("canvas");

        canvas.width = width;

        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        const result =
          canvas.toDataURL(
            "image/jpeg",
            0.4
          );

        resolve(result);

      };

      img.onerror = reject;

      img.src = event.target.result;

    };

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}

) {

function addStep(step = null) {

  const container =
    document.getElementById(
      "stepsContainer"
    );

  const stepId =
    crypto.randomUUID();

  const div =
    document.createElement("div");

  div.className =
    "step";

  div.dataset.stepId =
    stepId;

  const existingImage =
    step?.image || "";

  if (existingImage) {

    stepImages.set(
      stepId,
      existingImage
    );

  }

  div.innerHTML = `

    <div class="step-title">

      <strong>
        Step ${container.children.length + 1}
      </strong>

      <button class="danger remove">
        מחק
      </button>

    </div>

    <div class="form-group">

      <label>
        שם ה-Step
      </label>

      <input
        class="step-name"
        type="text"
        placeholder="לדוגמה: לשתות מים"
        value="${
          step
            ? escapeAttr(step.name)
            : ""
        }"
      >

    </div>

    <div class="form-group image-upload">

      <label>
        תמונה ל-Step
      </label>

      <input
        class="image-input step-image-input"
        type="file"
        accept="image/*"
      >

      <div
        class="step-image-preview image-preview">
      </div>

    </div>

    <div class="step-grid">

      <div>

        <label>
          משך בשניות
        </label>

        <input
          class="step-duration"
          type="number"
          min="1"
          value="${
            step
              ? step.duration
              : 60
          }"
        >

      </div>

      <div>

        <label>
          תדירות
        </label>

        <select class="frequency">

          <option value="1">
            כל יום
          </option>

          <option value="2">
            כל יומיים
          </option>

          <option value="3">
            כל 3 ימים
          </option>

          <option value="7">
            כל 7 ימים
          </option>

          <option value="custom">
            כל X ימים
          </option>

        </select>

      </div>

    </div>

    <div class="custom-days">

      <label>
        כל כמה ימים?
      </label>

      <input
        class="custom-value"
        type="number"
        min="1"
        value="2"
      >

    </div>

    <div class="step-start-date">

      <label>
        תאריך התחלת ה-Step
      </label>

      <input
        class="step-start-date-input"
        type="date"
        value="${
          step &&
          step.startDate
            ? escapeAttr(step.startDate)
            : getTodayDate()
        }"
      >

      <small>
        התדירות של ה-Step מתחילה להיספר מתאריך זה.
      </small>

    </div>

  `;

  container.appendChild(div);

  showStepImagePreview(div);

  const imageInput =
    div.querySelector(
      ".step-image-input"
    );

  imageInput.addEventListener(
    "change",
    async event => {

      const file =
        event.target.files[0];

      if (!file)
        return;

      try {

        const image =
          await compressImage(file);

        stepImages.set(
          stepId,
          image
        );

        showStepImagePreview(div);

      } catch (error) {

        console.error(error);

        alert(
          "לא ניתן לקרוא את התמונה."
        );

      }

    }
  );

  const frequency =
    div.querySelector(
      ".frequency"
    );

  const custom =
    div.querySelector(
      ".custom-days"
    );

  if (step) {

    const saved =
      String(
        step.frequency || "1"
      );

    if (
      ["1", "2", "3", "7"]
        .includes(saved)
    ) {

      frequency.value =
        saved;

    } else {

      frequency.value =
        "custom";

      custom.style.display =
        "block";

      div
        .querySelector(
          ".custom-value"
        )

    }

  }

  frequency.addEventListener(
    "change",
    () => {

        frequency.value === "custom"
          ? "block"
          : "none";

    }
  );

  div

    .addEventListener(
      "click",
      () => {

        stepImages.delete(
          stepId

        div.remove();

        renumberSteps();

    );

/* =========================
   SAVE ROUTINE
========================= */

document
  .getElementById("saveRoutineBtn")
  .addEventListener(
    "click",
    saveRoutine

async function saveRoutine() {

  const name =
    document
      .getElementById(
        "routineName"
      )
      .value
      .trim();

  if (!name) {

    alert(
      "כתוב שם ל-Routine."
    );

    return;

  }

  const days =
    [
      ...document.querySelectorAll(
        ".days input:checked"
      )
    ]
    .map(
      box => Number(box.value)
    );

  const steps = [];

  const stepElements =
    document.querySelectorAll(
      ".step"
    );

  for (
    let index = 0;
    index < stepElements.length;
    index++
  ) {

    const div =
      stepElements[index];

    const stepName =
      div
        .querySelector(
          ".step-name"
        )
        .value
        .trim();

    if (!stepName) {

      alert(
        `כתוב שם ל-Step ${index + 1}.`
      );

      return;

    }

    const duration =
      Number(
        div
          .querySelector(
            ".step-duration"
          )
          .value
      );

    const frequency =
      div
        .querySelector(
          ".frequency"
        )
        .value;

    let finalFrequency =
      frequency;

    if (frequency === "custom") {

      finalFrequency =
        div
          .querySelector(
            ".custom-value"
          )
          .value;

    }

    const startDate =
      div
        .querySelector(
          ".step-start-date-input"
        )
        .value;

    if (!startDate) {

      alert(
        `בחר תאריך התחלה ל-Step ${index + 1}.`
      );

      return;

    }

    const numericFrequency =
      Number(finalFrequency);

    if (
      !numericFrequency ||
      numericFrequency < 1
    ) {

      alert(
        `התדירות של Step ${index + 1} אינה תקינה.`
      );

      return;

    }

    const stepImage =
      stepImages.get(
        div.dataset.stepId
      ) || "";

    steps.push({

      name: stepName,

      image: stepImage,

      duration:
        duration > 0
          ? duration
          : 60,

      frequency:
        numericFrequency,

      startDate,

      order: index

    });

  }

  const data = {

    name,

    image:
      currentRoutineImage || "",

    days,

    steps,

    updatedAt:
      new Date().toISOString()

  };

  const estimatedSize =
    JSON.stringify(data).length;

  if (
    estimatedSize > 900000
  ) {

    alert(
      "התמונות גדולות מדי (קרוב למגבלת 1MB).\n\nמחק חלק מהתמונות או בחר תמונות קטנות יותר."
    );

    return;

  }

  const saveBtn =
    document.getElementById(
      "saveRoutineBtn"
    );

  saveBtn.disabled = true;

  saveBtn.textContent =
    "שומר...";

  try {

    const ref =
      collection(
        db,
        "users",
        currentUser.uid,
        "routines"
      );

    if (editingRoutineId) {

      await updateDoc(
        doc(
          db,
          "users",
          currentUser.uid,
          "routines",
          editingRoutineId
        ),
        data
      );

    } else {

      await addDoc(
        ref,
        data
      );

    }

    closeEditor();

    await loadRoutines();

    alert(
      "ה-Routine נשמר!"
    );

  } catch (error) {

    console.error(error);

    alert(
      "השמירה נכשלה:\n\n" +
      error.message
    );

  } finally {

    saveBtn.disabled = false;

    saveBtn.textContent =
      "שמור";

  }

}

/* =========================
   TODAY STEPS
========================= */

function getTodaySteps(routine) {

  if (
    !routine.steps ||
    routine.steps.length === 0
  )
    return [];

  const today =
    new Date();

  today.setHours(
    0,
    0,
    0,
    0
  );

  const todayDay =
    today.getDay();

  if (
    routine.days &&
    routine.days.length > 0 &&
    !routine.days.includes(
      todayDay
    )
  ) {

    return [];

  }

  return routine.steps.filter(
    step => {

      if (!step.startDate)
        return false;

      const start =
        parseDate(
          step.startDate
        );

      start.setHours(
        0,
        0,
        0,
        0
      );

      const difference =
        Math.floor(
          (
            today.getTime() -
            start.getTime()
          ) /
          86400000
        );

      if (difference < 0)
        return false;

      const frequency =
        Number(
          step.frequency || 1
        );

      return (
        difference %
        frequency === 0
      );

    }
  );

}


/* =========================
   START ROUTINE
========================= */

function startRoutine(routine) {

  const todaySteps =
    getTodaySteps(routine);

  if (
    todaySteps.length === 0
  ) {

    alert(
      "אין Steps של ה-Routine הזה להיום."
    );

    return;

  }

  todaySteps.sort(
    (a, b) =>
      Number(a.order || 0) -
      Number(b.order || 0)
  );

  activeRoutine =
    routine;

  activeSteps =
    todaySteps;

  activeStepIndex = 0;

  document
    .getElementById(
      "routineListScreen"
    )
    .style.display = "none";

  document
    .getElementById(
      "directRoutineScreen"
    )
    .style.display = "none";

  document
    .getElementById(
      "activeScreen"
    )
    .style.display = "block";

  document
    .getElementById(
      "activeRoutineName"
    )
    .textContent =
      routine.name;

  showStep();

}


/* =========================
   SHOW STEP
========================= */

function showStep() {

  clearInterval(
    timerInterval
  );

  if (
    activeStepIndex >=
    activeSteps.length
  ) {

    alert(
      "ה-Routine הושלם!"
    );

    exitRoutine();

    return;

  }

  const step =
    activeSteps[
      activeStepIndex
    ];

  document
    .getElementById(
      "activeStepName"
    )
    .textContent =
      step.name;

  const image =
    document.getElementById(
      "activeStepImage"
    );

  if (step.image) {

    image.src =
      step.image;

    image.classList.remove(
      "hidden"
    );

  } else {

    image.src = "";

    image.classList.add(
      "hidden"
    );

  }

  remainingSeconds =
    Number(step.duration);

  updateTimer();

  timerInterval =
    setInterval(
      () => {

        remainingSeconds--;

        updateTimer();

        if (
          remainingSeconds <= 0
        ) {

          clearInterval(
            timerInterval
          );

        }

      },
      1000
    );

}


/* =========================
   TIMER
========================= */

function updateTimer() {

  const minutes =
    Math.floor(
      remainingSeconds / 60
    );

  const seconds =
    remainingSeconds % 60;

  document
    .getElementById(
      "timer"
    )
    .textContent =

      String(minutes)
        .padStart(2, "0") +

      ":" +

      String(seconds)
        .padStart(2, "0");

}


/* =========================
   ONE TAP → DONE
========================= */

document
  .getElementById(

  )
  .addEventListener(
    "click",
    () => {

      if (
        !activeRoutine ||
        !activeSteps.length
      )
        return;

      activeStepIndex++;

      showStep();

    }
  );

function exitRoutine() {

  activeSteps = [];

}


/* =========================
   DATE FUNCTIONS
========================= */

function getTodayDate() {

  const date =
    new Date();

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      date.getDate()
    ).padStart(2, "0");

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


function parseDate(value) {

  const parts =
    value.split("-");

  return new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2])
  );

}


/* =========================
   SECURITY
========================= */

function escapeHtml(text) {

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeAttr(text) {

  return escapeHtml(text);

}
