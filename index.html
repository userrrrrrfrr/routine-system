const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

const storage =
getStorage(app);

const provider =
new GoogleAuthProvider();


/* =========================
   VARIABLES
========================= */

let currentUser = null;

let routines = [];

let editingRoutineId = null;

let existingRoutineImageUrl = "";

let activeRoutine = null;

let activeSteps = [];

let activeStepIndex = 0;

let timerInterval = null;

let remainingSeconds = 0;


/* =========================
   AUTH
========================= */

document
.getElementById("loginBtn")
.addEventListener(
  "click",
  async () => {

    try {

      await signInWithPopup(
        auth,
        provider
      );

    } catch (error) {

      console.error(error);

      alert(
        "ההתחברות נכשלה:\n\n" +
        error.message
      );

    }

  }
);


document
.getElementById("logoutBtn")
.addEventListener(
  "click",
  async () => {

    await signOut(auth);

  }
);


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if (user) {

      currentUser = user;

      document
      .getElementById("loginScreen")
      .style.display = "none";

      document
      .getElementById("app")
      .style.display = "block";

      document
      .getElementById("userInfo")
      .textContent =
        user.displayName ||
        user.email;

      await loadRoutines();

    } else {

      currentUser = null;

      document
      .getElementById("loginScreen")
      .style.display = "flex";

      document
      .getElementById("app")
      .style.display = "none";

    }

  }
);


/* =========================
   LOAD ROUTINES
========================= */

async function loadRoutines() {

  const list =
    document.getElementById(
      "routineList"
    );

  list.innerHTML =
    "טוען...";

  try {

    const refCollection =
      collection(
        db,
        "users",
        currentUser.uid,
        "routines"
      );

    const snapshot =
      await getDocs(
        refCollection
      );

    routines = [];

    snapshot.forEach(
      item => {

        routines.push({

          id: item.id,

          ...item.data()

        });

      }
    );

    renderRoutines();

    openRoutineFromLink();

  } catch (error) {

    console.error(error);

    list.innerHTML = `
      <div class="empty">
        לא ניתן לטעון את השגרות.<br><br>
        בדוק ש-Firestore מופעל וש-Rules מוגדרים.
      </div>
    `;

  }

}


/* =========================
   RENDER ROUTINES
========================= */

function renderRoutines() {

  const list =
    document.getElementById(
      "routineList"
    );

  list.innerHTML = "";

  if (routines.length === 0) {

    list.innerHTML = `
      <div class="empty">
        עדיין אין לך שגרות.<br>
        לחץ על "+ Routine חדש".
      </div>
    `;

    return;

  }

  routines.forEach(
    routine => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "routine-card";

      const todaySteps =
        getTodaySteps(routine);

      card.innerHTML = `

        ${
          routine.imageUrl
            ? `
              <img
                class="routine-image"
                src="${escapeAttr(routine.imageUrl)}"
                alt="Routine">
            `
            : ""
        }

        <h3>
          ${escapeHtml(routine.name)}
        </h3>

        <div class="routine-info">

          ${routine.steps?.length || 0}
          Steps

        </div>

        <div class="today-info">

          להיום:
          <strong>
            ${todaySteps.length}
          </strong>
          Steps

        </div>

        <div class="actions">

          <button class="primary start">
            התחל
          </button>

          <button class="secondary edit">
            ערוך
          </button>

          <button class="secondary share">
            🔗 העתק קישור
          </button>

          <button class="danger delete">
            מחק
          </button>

        </div>

      `;

      card
      .querySelector(".start")
      .addEventListener(
        "click",
        () => startRoutine(routine)
      );

      card
      .querySelector(".edit")
      .addEventListener(
        "click",
        () => openEditor(routine)
      );

      card
      .querySelector(".share")
      .addEventListener(
        "click",
        () => copyRoutineLink(routine.id)
      );

      card
      .querySelector(".delete")
      .addEventListener(
        "click",
        () => deleteRoutine(routine.id)
      );

      list.appendChild(card);

    }
  );

}


/* =========================
   COPY ROUTINE LINK
========================= */

async function copyRoutineLink(routineId) {

  const url =
    window.location.origin +
    window.location.pathname +
    "?routine=" +
    encodeURIComponent(
      routineId
    );

  try {

    await navigator.clipboard.writeText(
      url
    );

    alert(
      "הקישור הועתק!"
    );

  } catch (error) {

    console.error(error);

    prompt(
      "העתק את הקישור:",
      url
    );

  }

}


/* =========================
   OPEN ROUTINE FROM LINK
========================= */

function openRoutineFromLink() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const routineId =
    params.get("routine");

  if (!routineId) {
    return;
  }

  const routine =
    routines.find(
      item =>
        item.id === routineId
    );

  if (!routine) {

    alert(
      "ה-Routine לא נמצא בחשבון הזה."
    );

    return;

  }

  showDirectRoutine(routine);

}


/* =========================
   SHOW DIRECT ROUTINE
========================= */

function showDirectRoutine(routine) {

  document
  .getElementById(
    "routineListScreen"
  )
  .style.display =
    "none";

  document
  .getElementById(
    "editorScreen"
  )
  .classList.add(
    "hidden"
  );

  document
  .getElementById(
    "activeScreen"
  )
  .style.display =
    "none";

  document
  .getElementById(
    "directRoutineScreen"
  )
  .style.display =
    "block";


  const imageContainer =
    document.getElementById(
      "directRoutineImageContainer"
    );

  imageContainer.innerHTML =
    routine.imageUrl
      ? `
        <img
          class="routine-image"
          src="${escapeAttr(routine.imageUrl)}"
          alt="Routine">
      `
      : "";


  document
  .getElementById(
    "directRoutineName"
  )
  .textContent =
    routine.name;


  const stepsContainer =
    document.getElementById(
      "directRoutineSteps"
    );

  stepsContainer.innerHTML = "";


  const todaySteps =
    getTodaySteps(routine);


  if (
    todaySteps.length === 0
  ) {

    stepsContainer.innerHTML = `
      <div class="empty">
        אין Steps פעילים להיום.
      </div>
    `;

  } else {

    todaySteps
    .sort(
      (a, b) =>
        Number(a.order || 0) -
        Number(b.order || 0)
    )
    .forEach(
      (step, index) => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "direct-step";

        div.innerHTML = `

          <strong>
            Step ${index + 1}
          </strong>

          <br><br>

          ${
            step.imageUrl
              ? `
                <img
                  class="step-image"
                  src="${escapeAttr(step.imageUrl)}"
                  alt="Step">
              `
              : ""
          }

          <br>

          ${escapeHtml(step.name)}

        `;

        stepsContainer.appendChild(
          div
        );

      }
    );

  }


  document
  .getElementById(
    "directStartBtn"
  )
  .onclick =
    () => startRoutine(routine);

}


/* =========================
   DIRECT BACK
========================= */

document
.getElementById(
  "directBackBtn"
)
.addEventListener(
  "click",
  () => {

    const url =
      window.location.origin +
      window.location.pathname;

    window.history.replaceState(

    document
    .getElementById(
      "directRoutineScreen"
    )
    .style.display =
      "none";

    document
    .getElementById(
      "routineListScreen"
    )
    .style.display =
      "block";

  }
);

========================= */

document

function openEditor(routine) {

  document

    "routineListScreen"

  document
  .getElementById(
    "editorScreen"

  .classList.remove(
    "hidden"

  editingRoutineId =

function showImagePreview(
  file,
  previewId,
  imageId,
  customPreview = null,
  customImage = null
) {

  const preview =
    customPreview ||
    document.getElementById(
      previewId
    );

  const image =
    customImage ||
    document.getElementById(
      imageId
    );


  const reader =
    new FileReader();


  reader.onload =
    event => {

      preview.style.display =
        "block";

      image.src =
        event.target.result;

    };


  reader.readAsDataURL(file);

}

async function uploadImage(
  file,
  path
) {

  if (!file) {
    return null;
  }


  const storageRef =
    ref(
      storage,
      path
    );


  await uploadBytes(
    storageRef,
    file
  );


  return await getDownloadURL(
    storageRef
  );

}

async function saveRoutine() {

  if (!currentUser) {
    return;
  }


  const name =
    document
    .getElementById(
      "routineName"
    )
    .value
    .trim();


  if (!name) {

    alert(
      "כתוב שם ל-Routine."
    );

    return;

  }


  const days =
    [...document
      .querySelectorAll(
        ".days input:checked"
      )]
      .map(
        box =>
          Number(box.value)
      );


  const routineImageFile =
    document
    .getElementById(
      "routineImage"
    )
    .files[0];


  const steps = [];


  const stepElements =
    document.querySelectorAll(
      ".step"
    );


  for (
    let index = 0;
    index < stepElements.length;
    index++
  ) {

    const div =
      stepElements[index];


    const stepName =
      div
      .querySelector(
        ".step-name"
      )
      .value
      .trim();


    if (!stepName) {

      alert(
        `כתוב שם ל-Step ${index + 1}.`
      );

      return;

    }


    const duration =
      Number(
        div
        .querySelector(
          ".step-duration"
        )
        .value
      );


    const frequency =
      div
      .querySelector(
        ".frequency"
      )
      .value;


    let finalFrequency =
      frequency;


    if (
      frequency === "custom"
    ) {

      finalFrequency =
        div
        .querySelector(
          ".custom-value"
        )
        .value;

    }


    const startDate =
      div
      .querySelector(
        ".step-start-date-input"
      )
      .value;


    if (!startDate) {

      alert(
        `בחר תאריך התחלה ל-Step ${index + 1}.`
      );

      return;

    }


    const numericFrequency =
      Number(
        finalFrequency
      );


    if (
      !numericFrequency ||
      numericFrequency < 1
    ) {

      alert(
        `התדירות של Step ${index + 1} אינה תקינה.`
      );

      return;

    }


    const imageFile =
      div
      .querySelector(
        ".step-image-input"
      )
      .files[0];


    steps.push({

      name:
        stepName,

      duration:
        duration > 0
          ? duration
          : 60,

      frequency:
        numericFrequency,

      startDate:
        startDate,

      order:
        index,

      imageFile:
        imageFile || null,

      imageUrl:
        step?.imageUrl || null

    });

  }


  try {

    const refCollection =
      collection(
        db,
        "users",
        currentUser.uid,
        "routines"
      );


    let routineId =
      editingRoutineId;


    if (!routineId) {

      const newDoc =
        await addDoc(
          refCollection,
          {
            name,
            days,
            steps: [],
            imageUrl:
              null,
            updatedAt:
              new Date().toISOString()
          }
        );

      routineId =
        newDoc.id;

    }


    let routineImageUrl =
      existingRoutineImageUrl ||
      null;


    if (routineImageFile) {

      routineImageUrl =
        await uploadImage(
          routineImageFile,
          `users/${currentUser.uid}/routines/${routineId}/routine.jpg`
        );

    }


    const finalSteps = [];


    for (
      let index = 0;
      index < steps.length;
      index++
    ) {

      const step =
        steps[index];


      let imageUrl =
        step.imageUrl || null;


      if (step.imageFile) {

        imageUrl =
          await uploadImage(
            step.imageFile,
            `users/${currentUser.uid}/routines/${routineId}/step-${index}.jpg`
          );

      }


      finalSteps.push({

        name:
          step.name,

        duration:
          step.duration,

        frequency:
          step.frequency,

        startDate:
          step.startDate,

        order:
          index,

        imageUrl:
          imageUrl

      });

    }


    const data = {

      name,

      days,

      steps:
        finalSteps,

      imageUrl:
        routineImageUrl,

      updatedAt:
        new Date().toISOString()

    };


    await updateDoc(

      doc(
        db,
        "users",
        currentUser.uid,
        "routines",
        routineId
      ),

      data

    );


    closeEditor();

    await loadRoutines();


    alert(
      "ה-Routine נשמר!"
    );


  } catch (error) {

    console.error(error);

    alert(
      "השמירה נכשלה:\n\n" +
      error.message
    );

  }

}

/* =========================
   TODAY STEPS
========================= */

function getTodaySteps(routine) {

  if (
    !routine.steps ||
    routine.steps.length === 0
  ) {

    return [];

  }


  const today =
    new Date();


  today.setHours(
    0,
    0,
    0,
    0
  );


  const todayDay =
    today.getDay();


  if (
    routine.days &&
    routine.days.length > 0 &&
    !routine.days.includes(
      todayDay
    )
  ) {

    return [];

  }


  return routine.steps.filter(
    step => {

      if (!step.startDate) {

        return false;

      }


      const start =
        parseDate(
          step.startDate
        );


      start.setHours(
        0,
        0,
        0,
        0
      );


      const difference =
        Math.floor(
          (
            today.getTime() -
            start.getTime()
          ) /
          86400000
        );


      if (
        difference < 0
      ) {

        return false;

      }


      const frequency =
        Number(
          step.frequency || 1
        );


      return (
        difference %
        frequency
        === 0
      );

    }
  );

}


/* =========================
   START ROUTINE
========================= */

function startRoutine(routine) {

  const todaySteps =
    getTodaySteps(routine);


  if (
    todaySteps.length === 0
  ) {

    alert(
      "אין Steps של ה-Routine הזה להיום."
    );

    return;

  }


  todaySteps.sort(
    (a, b) =>
      Number(a.order || 0) -
      Number(b.order || 0)
  );


  activeRoutine =
    routine;

  activeSteps =

  )

  showStep();

}


/* =========================

========================= */

function showStep() {

  clearInterval(
    timerInterval
  );


  if (
    activeStepIndex >=
    activeSteps.length
  ) {

    alert(
      "ה-Routine הושלם!"
    );


    exitRoutine();

    return;

  }


  const step =
    activeSteps[
      activeStepIndex
    ];


  const imageContainer =
    document.getElementById(
      "activeStepImageContainer"
    );


  imageContainer.innerHTML =
    step.imageUrl
      ? `
        <img
          class="active-image"
          src="${escapeAttr(step.imageUrl)}"
          alt="Step">
      `
      : "";


  document
  .getElementById(
    "activeStepName"
  )
  .textContent =
    step.name;


  remainingSeconds =
    Number(
      step.duration
    );


  updateTimer();


  timerInterval =
    setInterval(
      () => {

        remainingSeconds--;

        if (
          remainingSeconds < 0
        ) {

          remainingSeconds =
            0;

        }

        updateTimer();


        if (
          remainingSeconds <= 0
        ) {

          clearInterval(
            timerInterval
          );

        }

      },
      1000
    );

}


/* =========================
   TIMER
========================= */

function updateTimer() {

  const minutes =
    Math.floor(
      remainingSeconds /
      60
    );


  const seconds =
    remainingSeconds %
    60;


  document
  .getElementById(
    "timer"
  )
  .textContent =
    String(minutes)
      .padStart(2, "0")
    +
    ":"
    +
    String(seconds)
      .padStart(2, "0");

}

/* =========================
   DATE FUNCTIONS
========================= */

function getTodayDate() {

  const date =
    new Date();


  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    )
    .padStart(2, "0");


  const day =
    String(
      date.getDate()
    )
    .padStart(2, "0");


  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


function parseDate(value) {

  const parts =
    value.split("-");


  return new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2])
  );

}


/* =========================
   SECURITY
========================= */

function escapeHtml(text) {

  return String(text)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeAttr(text) {

  return escapeHtml(text);

}
