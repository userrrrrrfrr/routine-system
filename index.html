<script type="module">


/* =========================
   FIREBASE IMPORTS
========================= */

import {
  initializeApp
}
from

}
from

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyCGTJFidIrp_YAuKOg2CCEO-vjFCiakkHo",

  authDomain:
  "site-c224f.firebaseapp.com",

  projectId:
  "site-c224f",

  storageBucket:
  "site-c224f.firebasestorage.app",

  messagingSenderId:
  "709702843873",

  appId:
  "1:709702843873:web:a326854107acb20e6ee6a0",

  measurementId:
  "G-GC5LS15YEC"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


const provider =
new GoogleAuthProvider();


/* =========================
   VARIABLES
========================= */

let currentUser = null;

let routines = [];

let editingRoutineId = null;

let activeRoutine = null;

let activeSteps = [];

let activeStepIndex = 0;

let timerInterval = null;

let remainingSeconds = 0;


/* =========================
   AUTH
========================= */

document
.getElementById("loginBtn")
.addEventListener(
  "click",
  async () => {

    try {

      await signInWithPopup(
        auth,
        provider
      );

    } catch (error) {

      console.error(error);

      alert(
        "ההתחברות נכשלה:\n\n" +
        error.message
      );

    }

  }
);


document
.getElementById("logoutBtn")
.addEventListener(
  "click",
  async () => {

    await signOut(auth);

  }
);


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if (user) {

      currentUser = user;

      document
      .getElementById("loginScreen")
      .style.display = "none";

      document
      .getElementById("app")
      .style.display = "block";

      document
      .getElementById("userInfo")
      .textContent =
        user.displayName ||
        user.email;

      await loadRoutines();

    } else {

      currentUser = null;

      document
      .getElementById("loginScreen")
      .style.display = "flex";

      document
      .getElementById("app")
      .style.display = "none";

    }

  }
);


/* =========================
   LOAD ROUTINES
========================= */

async function loadRoutines() {

  const list =
    document.getElementById(
      "routineList"
    );

  list.innerHTML =
    "טוען...";


  try {

    const ref =
      collection(
        db,
        "users",
        currentUser.uid,
        "routines"
      );


    const snapshot =
      await getDocs(ref);


    routines = [];


    snapshot.forEach(
      item => {

        routines.push({

          id: item.id,

          ...item.data()

        });

      }
    );


    renderRoutines();

    openRoutineFromLink();

  } catch (error) {

    console.error(error);

    list.innerHTML = `
      <div class="empty">
        לא ניתן לטעון את השגרות.<br><br>
        בדוק ש-Firestore מופעל וש-Rules מוגדרים.
      </div>
    `;

  }

}


/* =========================
   RENDER ROUTINES
========================= */

function renderRoutines() {

  const list =
    document.getElementById(
      "routineList"
    );


  list.innerHTML = "";


  if (routines.length === 0) {

    list.innerHTML = `
      <div class="empty">
        עדיין אין לך שגרות.<br>
        לחץ על "+ Routine חדש".
      </div>
    `;

    return;

  }


  routines.forEach(
    routine => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "routine-card";


      const todaySteps =
        getTodaySteps(routine);


      card.innerHTML = `

        <h3>
          ${escapeHtml(
            routine.name
          )}
        </h3>


        <div class="routine-info">

          ${routine.steps?.length || 0}
          Steps

        </div>


        <div class="today-info">

          להיום:
          <strong>
            ${todaySteps.length}
          </strong>
          Steps

        </div>


        <div class="actions">

          <button
            class="primary start">

            התחל

          </button>


          <button
            class="secondary edit">

            ערוך

          </button>


          <button
            class="secondary share">

            🔗 העתק קישור

          </button>


          <button
            class="danger delete">

            מחק

          </button>

        </div>

      `;


      card
      .querySelector(".start")
      .addEventListener(
        "click",
        () => startRoutine(routine)
      );


      card
      .querySelector(".edit")
      .addEventListener(
        "click",
        () => openEditor(routine)
      );


      card
      .querySelector(".share")
      .addEventListener(
        "click",
        () => copyRoutineLink(routine.id)
      );


      card
      .querySelector(".delete")
      .addEventListener(
        "click",
        () => deleteRoutine(routine.id)
      );


      list.appendChild(card);

    }
  );

}


/* =========================
   COPY ROUTINE LINK
========================= */

async function copyRoutineLink(routineId) {

  const url =
    window.location.origin +
    window.location.pathname +
    "?routine=" +
    encodeURIComponent(
      routineId
    );


  try {

    await navigator.clipboard.writeText(
      url
    );


    alert(
      "הקישור הועתק!"
    );

  } catch (error) {

    console.error(error);

    prompt(
      "העתק את הקישור:",
      url
    );

  }

}


/* =========================
   OPEN ROUTINE FROM LINK
========================= */

function openRoutineFromLink() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const routineId =
    params.get("routine");


  if (!routineId) {

    return;

  }


  const routine =
    routines.find(
      item =>
        item.id === routineId
    );


  if (!routine) {

    alert(
      "ה-Routine לא נמצא בחשבון הזה."
    );

    return;

  }


  showDirectRoutine(routine);

}


/* =========================
   SHOW DIRECT ROUTINE
========================= */

function showDirectRoutine(routine) {

  document
  .getElementById(
    "routineListScreen"
  )
  .style.display =
    "none";


  document
  .getElementById(
    "editorScreen"
  )
  .classList.add(
    "hidden"
  );


  document
  .getElementById(
    "activeScreen"
  )
  .style.display =
    "none";


  document
  .getElementById(
    "directRoutineScreen"
  )
  .style.display =
    "block";


  document
  .getElementById(
    "directRoutineName"
  )
  .textContent =
    routine.name;


  const stepsContainer =
    document.getElementById(
      "directRoutineSteps"
    );


  stepsContainer.innerHTML = "";


  const todaySteps =
    getTodaySteps(routine);


  if (
    todaySteps.length === 0
  ) {

    stepsContainer.innerHTML = `
      <div class="empty">
        אין Steps פעילים להיום.
      </div>
    `;

  } else {

    todaySteps
    .sort(
      (a, b) =>
        Number(a.order || 0) -
        Number(b.order || 0)
    )
    .forEach(
      (step, index) => {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "direct-step";


        div.innerHTML = `

          <strong>
            Step ${index + 1}
          </strong>

          <br>

          ${escapeHtml(
            step.name
          )}

        `;


        stepsContainer.appendChild(
          div
        );

      }
    );

  }


  document
  .getElementById(
    "directStartBtn"
  )
  .onclick =
    () => startRoutine(routine);

}


/* =========================
   DIRECT BACK
========================= */

document
.getElementById(
  "directBackBtn"
)
.addEventListener(
  "click",
  () => {

    const url =
      window.location.origin +
      window.location.pathname;


    window.history.replaceState(
      {},
      "",
      url
    );


    document
    .getElementById(
      "directRoutineScreen"
    )
    .style.display =
      "none";


    document
    .getElementById(
      "routineListScreen"
    )
    .style.display =
      "block";

  }
);


/* =========================
   NEW ROUTINE
========================= */

document
.getElementById("newRoutineBtn")
.addEventListener(
  "click",
  () => openEditor(null)
);


/* =========================
   OPEN EDITOR
========================= */

function openEditor(routine) {

  document
  .getElementById(
    "routineListScreen"
  )
  .style.display =
    "none";


  document
  .getElementById(
    "directRoutineScreen"
  )
  .style.display =
    "none";


  document
  .getElementById(
    "editorScreen"
  )
  .classList.remove(
    "hidden"
  );


  editingRoutineId =
    routine
      ? routine.id
      : null;


  document
  .getElementById(
    "editorTitle"
  )
  .textContent =
    routine
      ? "עריכת Routine"
      : "Routine חדש";


  document
  .getElementById(
    "routineName"
  )
  .value =
    routine
      ? routine.name
      : "";


  document
  .querySelectorAll(
    ".days input"
  )
  .forEach(
    checkbox => {

      checkbox.checked =
        routine
          ? (routine.days || [])
              .includes(
                Number(
                  checkbox.value
                )
              )
          : false;

    }
  );


  const container =
    document.getElementById(
      "stepsContainer"
    );


  container.innerHTML = "";


  if (
    routine &&
    routine.steps
  ) {

    routine.steps.forEach(
      step => addStep(step)
    );

  }

}


/* =========================
   ADD STEP
========================= */

document
.getElementById("addStepBtn")
.addEventListener(
  "click",
  () => addStep()
);


function addStep(step = null) {

  const container =
    document.getElementById(
      "stepsContainer"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "step";


  div.innerHTML = `

    <div class="step-title">

      <strong>
        Step ${container.children.length + 1}
      </strong>

      <button
        class="danger remove">

        מחק

      </button>

    </div>


    <div class="form-group">

      <label>
        שם ה-Step
      </label>

      <input
        class="step-name"
        type="text"
        placeholder="לדוגמה: לשתות מים"
        value="${
          step
            ? escapeAttr(step.name)
            : ""
        }">

    </div>


    <div class="step-grid">

      <div>

        <label>
          משך בשניות
        </label>

        <input
          class="step-duration"
          type="number"
          min="1"
          value="${
            step
              ? step.duration
              : 60
          }">

      </div>


      <div>

        <label>
          תדירות
        </label>

        <select class="frequency">

          <option value="1">
            כל יום
          </option>

          <option value="2">
            כל יומיים
          </option>

          <option value="3">
            כל 3 ימים
          </option>

          <option value="7">
            כל 7 ימים
          </option>

          <option value="custom">
            כל X ימים
          </option>

        </select>

      </div>

    </div>


    <div class="custom-days">

      <label>
        כל כמה ימים?
      </label>

      <input
        class="custom-value"
        type="number"
        min="1"
        value="2">

    </div>


    <!-- START DATE OF THIS STEP -->

    <div class="step-start-date">

      <label>
        תאריך התחלת ה-Step
      </label>

      <input
        class="step-start-date-input"
        type="date"
        value="${
          step && step.startDate
            ? escapeAttr(step.startDate)
            : getTodayDate()
        }">

      <small>
        התדירות של ה-Step מתחילה להיספר מתאריך זה.
      </small>

    </div>

  `;


  container.appendChild(div);


  const frequency =
    div.querySelector(
      ".frequency"
    );


  const custom =
    div.querySelector(
      ".custom-days"
    );


  if (step) {

    const saved =
      String(
        step.frequency || "1"
      );


    if (
      ["1", "2", "3", "7"]
      .includes(saved)
    ) {

      frequency.value =
        saved;

    } else {

      frequency.value =
        "custom";

      custom.style.display =
        "block";


      div.querySelector(
        ".custom-value"
      ).value =
        saved;

    }

  }


  frequency.addEventListener(
    "change",
    () => {

      custom.style.display =
        frequency.value === "custom"
          ? "block"
          : "none";

    }
  );


  div
  .querySelector(".remove")
  .addEventListener(
    "click",
    () => {

      div.remove();

      renumberSteps();

    }
  );

}

/* =========================
   SAVE ROUTINE
========================= */

document
.getElementById(
  "saveRoutineBtn"
)
.addEventListener(
  "click",
  saveRoutine

async function saveRoutine() {

  const name =
    document
    .getElementById(
      "routineName"
    )
    .value
    .trim();


  if (!name) {

    alert(
      "כתוב שם ל-Routine."
    );

    return;

  }


  const days =
    [...document
      .querySelectorAll(
        ".days input:checked"
      )]
      .map(
        box =>
          Number(box.value)
      );


  const steps = [];


  const stepElements =
    document.querySelectorAll(
      ".step"
    );


  for (
    let index = 0;
    index < stepElements.length;
    index++
  ) {

    const div =
      stepElements[index];


    const stepName =
      div
      .querySelector(
        ".step-name"
      )
      .value
      .trim();


    if (!stepName) {

      alert(
        `כתוב שם ל-Step ${index + 1}.`
      );

      return;

    }


    const duration =
      Number(
        div
        .querySelector(
          ".step-duration"
        )
        .value
      );


    const frequency =
      div
      .querySelector(
        ".frequency"
      )
      .value;


    let finalFrequency =
      frequency;


    if (
      frequency === "custom"
    ) {

      finalFrequency =
        div
        .querySelector(
          ".custom-value"
        )
        .value;

    }


    const startDate =
      div
      .querySelector(
        ".step-start-date-input"
      )
      .value;


    if (!startDate) {

      alert(
        `בחר תאריך התחלה ל-Step ${index + 1}.`
      );

      return;

    }


    const numericFrequency =
      Number(
        finalFrequency
      );


    if (
      !numericFrequency ||
      numericFrequency < 1
    ) {

      alert(
        `התדירות של Step ${index + 1} אינה תקינה.`
      );

      return;

    }


    steps.push({

      name:
        stepName,

      duration:
        duration > 0
          ? duration
          : 60,

      frequency:
        numericFrequency,

      startDate:
        startDate,

      order:
        index

    });

  }


  const data = {

    name,

    days,

    steps,

    updatedAt:
      new Date().toISOString()

  };


  try {

    const ref =
      collection(
        db,
        "users",
        currentUser.uid,
        "routines"
      );


    if (editingRoutineId) {

      await updateDoc(

        doc(
          db,
          "users",
          currentUser.uid,
          "routines",
          editingRoutineId
        ),

        data

      );

    } else {

      await addDoc(
        ref,
        data
      );

    }


    closeEditor();

    await loadRoutines();


    alert(
      "ה-Routine נשמר!"
    );


  } catch (error) {

    console.error(error);

    alert(
      "השמירה נכשלה:\n\n" +
      error.message
    );

  }

}

/* =========================
   TODAY STEPS
========================= */

function getTodaySteps(routine) {

  if (
    !routine.steps ||
    routine.steps.length === 0
  ) {

    return [];

  }


  const today =
    new Date();


  today.setHours(
    0,
    0,
    0,
    0
  );


  /*
   * ימי ה-Routine עדיין
   * קובעים באילו ימים
   * אפשר להפעיל את ה-Routine.
   */

  const todayDay =
    today.getDay();


  if (
    routine.days &&
    routine.days.length > 0 &&
    !routine.days.includes(
      todayDay
    )
  ) {

    return [];

  }


  /*
   * כל Step נבדק בנפרד.
   */

  return routine.steps.filter(
    step => {

      /*
       * לכל Step יש תאריך
       * התחלה עצמאי.
       */

      if (!step.startDate) {

        return false;

      }


      const start =
        parseDate(
          step.startDate
        );


      start.setHours(
        0,
        0,
        0,
        0
      );


      /*
       * מספר הימים שעברו
       * מאז תאריך התחלת ה-Step.
       */

      const difference =
        Math.floor(
          (
            today.getTime() -
            start.getTime()
          ) /
          86400000
        );


      /*
       * ה-Step עדיין לא התחיל.
       */

      if (
        difference < 0
      ) {

        return false;

      }


      const frequency =
        Number(
          step.frequency || 1
        );


      /*
       * התדירות מתחילה
       * מתאריך ה-Step.
       */

      return (
        difference %
        frequency
        === 0
      );

    }
  );

}


/* =========================
   START ROUTINE
========================= */

function startRoutine(routine) {

  const todaySteps =
    getTodaySteps(routine);


  if (
    todaySteps.length === 0
  ) {

    alert(
      "אין Steps של ה-Routine הזה להיום."
    );

    return;

  }


  todaySteps.sort(
    (a, b) =>
      Number(a.order || 0) -
      Number(b.order || 0)
  );


  activeRoutine =
    routine;


  activeSteps =
    todaySteps;


  activeStepIndex =
    0;


  document
  .getElementById(
    "routineListScreen"
  )
  .style.display =
    "none";


  document
  .getElementById(
    "directRoutineScreen"
  )
  .style.display =
    "none";


  document
  .getElementById(
    "activeScreen"
  )
  .style.display =
    "block";


  document
  .getElementById(
    "activeRoutineName"
  )
  .textContent =
    routine.name;


  showStep();

}


/* =========================
   SHOW STEP
========================= */

function showStep() {

  clearInterval(
    timerInterval
  );


  if (
    activeStepIndex >=
    activeSteps.length
  ) {

    alert(
      "ה-Routine הושלם!"
    );


    exitRoutine();

    return;

  }


  const step =
    activeSteps[
      activeStepIndex
    ];


  document
  .getElementById(
    "activeStepName"
  )
  .textContent =
    step.name;


  remainingSeconds =
    Number(
      step.duration
    );


  updateTimer();


  timerInterval =
    setInterval(
      () => {

        remainingSeconds--;

        updateTimer();


        if (
          remainingSeconds <= 0
        ) {

          clearInterval(
            timerInterval
          );

        }

      },
      1000
    );

}


/* =========================
   TIMER
========================= */

function updateTimer() {

  const minutes =
    Math.floor(
      remainingSeconds /
      60
    );


  const seconds =
    remainingSeconds %
    60;


  document
  .getElementById(
    "timer"
  )
  .textContent =
    String(minutes)
      .padStart(2, "0")
    +
    ":"
    +
    String(seconds)
      .padStart(2, "0");

}

document

}


/* =========================
   DATE FUNCTIONS
========================= */

function getTodayDate() {

  const date =
    new Date();


  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    )
    .padStart(2, "0");


  const day =
    String(
      date.getDate()
    )
    .padStart(2, "0");


  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


function parseDate(value) {

  const parts =
    value.split("-");


  return new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2])
  );

}


/* =========================
   SECURITY
========================= */

function escapeHtml(text) {

  return String(text)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeAttr(text) {

  return escapeHtml(text);

}
