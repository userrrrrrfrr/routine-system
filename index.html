<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routine</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      color: #111;
    }
    button,
    input,
    select {
      font: inherit;
    }
    button {
      cursor: pointer;
    }
    .hidden {
      display: none !important;
    }
    /* LOGIN */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 40px 30px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.08);
    }
    .login-box h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }
    .login-box p {
      color: #666;
      margin-bottom: 30px;
    }
    .google-btn {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: white;
    }
    /* APP */
    #app {
      display: none;
    }
    .container {
      width: 92%;
      max-width: 900px;
      margin: auto;
      padding: 12px 0 60px;
    }
    /* USER SIDE PANEL */
    .user-tab {
      position: fixed;
      top: 18px;
      left: 0;
      z-index: 1000;
      background: white;
      border: 1px solid #e5e5e5;
      border-left: 0;
      border-radius: 0 14px 14px 0;
      padding: 9px 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: #555;
      transition: transform .25s ease;
    }
    .user-tab-icon {
      font-size: 16px;
    }
    .user-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      max-width: 80vw;
      height: 100vh;
      background: white;
      z-index: 1001;
      box-shadow: 8px 0 30px rgba(0,0,0,.12);
      transform: translateX(-100%);
      transition: transform .28s ease;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
    }
    .user-panel.open {
      transform: translateX(0);
    }
    .user-panel-close {
      width: 36px;
      height: 36px;
      border: 0;
      background: #f5f5f7;
      border-radius: 10px;
      font-size: 20px;
      margin-bottom: 30px;
    }
    .user-panel-title {
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }
    #panelUserInfo {
      font-size: 16px;
      font-weight: 600;
      word-break: break-word;
      margin-bottom: 30px;
    }
    .panel-logout {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 12px;
      color: #d00;
    }
    .user-panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.18);
      z-index: 1000;
      display: none;
    }
    .user-panel-overlay.show {
      display: block;
    }
    /* MAIN HEADER */
    .main-title {
      background: white;
      padding: 18px 20px;
      border-radius: 20px;
      margin-bottom: 16px;
      text-align: center;
    }
    .main-title h1 {
      margin: 0;
      font-size: 30px;
    }
    /* CARDS */
    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    .top-row h2 {
      margin: 0;
    }
    .primary {
      background: #111;
      color: white;
      border: 0;
      padding: 12px 18px;
      border-radius: 10px;
    }
    .secondary {
      background: white;
      border: 1px solid #ddd;
      padding: 10px 15px;
      border-radius: 10px;
    }
    .danger {
      color: #d00;
      background: white;
      border: 1px solid #ddd;
      padding: 10px 15px;
      border-radius: 10px;
    }
    /* IMAGE UPLOAD */
    .image-upload {
      margin-top: 10px;
    }
    .image-upload label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .image-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
    }
    .image-preview {
      margin-top: 12px;
      position: relative;
    }
    .image-preview img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 15px;
      border: 1px solid #eee;
      display: block;
    }
    .remove-image {
      margin-top: 8px;
      padding: 8px 12px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 8px;
      color: #d00;
    }
    .routine-image {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 15px;
      display: block;
    }
    .direct-routine-image {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 20px;
    }
    /* ROUTINES */
    .routine-card {
      border: 1px solid #eee;
      border-radius: 15px;
      padding: 18px;
      margin-top: 12px;
    }
    .routine-card h3 {
      margin: 0 0 7px;
    }
    .routine-info {
      color: #777;
      font-size: 14px;
      margin-bottom: 15px;
      line-height: 1.7;
    }
    .today-info {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: #f5f5f7;
      font-size: 14px;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .empty {
      text-align: center;
      color: #777;
      padding: 35px 10px;
    }
    /* FORM */
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }
    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
    }
    .days {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .day input {
      display: none;
    }
    .day span {
      display: block;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
    }
    .day input:checked + span {
      background: #111;
      color: white;
    }
    /* STEPS & REUSE CONTROL */
    .step {
      border: 1px solid #eee;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fafafa;
      position: relative;
      transition: opacity 0.15s ease, border-color 0.15s ease;
    }
    .step.dragging {
      opacity: 0.45;
      border: 2px dashed #111;
    }
    .step-drag-handle {
      cursor: grab;
      padding: 4px 10px;
      background: #e5e5ea;
      border-radius: 6px;
      font-size: 16px;
      user-select: none;
      margin-left: 8px;
      display: inline-block;
      line-height: 1;
    }
    .step-drag-handle:active {
      cursor: grabbing;
    }
    .step-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .step-id-tag {
      font-size: 11px;
      background: #e5e5ea;
      padding: 3px 8px;
      border-radius: 6px;
      color: #555;
      font-weight: normal;
    }
    .step-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .disable-box {
      margin-top: 15px;
      padding: 14px;
      border: 1px dashed #ccc;
      border-radius: 12px;
      background: #fcfcfc;
    }
    .activation-box {
      margin-top: 15px;
      padding: 14px;
      border: 1px dashed #aaa;
      border-radius: 12px;
      background: #fcfcfc;
    }
    .activation-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .activation-rule-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      margin-bottom: 10px;
      background: #fff;
      padding: 10px;
      border: 1px solid #eaeaea;
      border-radius: 10px;
    }
    .activation-rule-row > div {
      flex: 1;
    }
    .activation-rule-row label {
      font-size: 12px;
      color: #666;
      display: block;
      margin-bottom: 4px;
    }
    .activation-box .btn-add-rule {
      background: #f0f0f3;
      border: 1px solid #ddd;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .activation-box .btn-remove-rule {
      padding: 10px 14px;
      background: #fff;
      border: 1px solid #ddd;
      color: #d00;
      border-radius: 8px;
    }
    .disable-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .disable-rule-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      margin-bottom: 10px;
      background: #fff;
      padding: 10px;
      border: 1px solid #eaeaea;
      border-radius: 10px;
    }
    .disable-rule-row > div {
      flex: 1;
    }
    .disable-rule-row label {
      font-size: 12px;
      color: #666;
      display: block;
      margin-bottom: 4px;
    }
    .btn-add-rule {
      background: #f0f0f3;
      border: 1px solid #ddd;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .btn-remove-rule {
      padding: 10px 14px;
      background: #fff;
      border: 1px solid #ddd;
      color: #d00;
      border-radius: 8px;
    }
    .step-actions-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      background: #f0f0f3;
      padding: 12px;
      border-radius: 12px;
      align-items: center;
    }
    .step-actions-bar select {
      flex: 1;
    }
    /* ACTIVE ROUTINE */
    #activeScreen {
      display: none;
      min-height: auto;
      padding: 0;
    }
    .active-box {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      border-radius: 28px;
      padding: 16px 22px 24px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }
    #activeRoutineName {
      margin: 0 0 8px;
      font-size: 17px;
      font-weight: 600;
      color: #222;
      text-align: left;
      width: 100%;
    }
    .active-step-card {
      background: #fafafa;
      border: 2px dashed #e0e0e0;
      border-radius: 20px;
      padding: 18px 12px;
      margin-bottom: 12px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }
    .active-step-card:hover {
      border-color: #bbb;
    }
    .active-step-card:active {
      background-color: #f0f0f3;
      transform: scale(0.99);
    }
    .active-step-image {
      width: 100%;
      max-height: 340px;
      object-fit: contain;
      border-radius: 18px;
      margin: 0 auto 6px;
      display: block;
      pointer-events: none;
    }
    #activeStepName {
      font-size: 42px;
      font-weight: 800;
      color: #d00;
      margin: 8px 0 8px;
      line-height: 1.15;
      letter-spacing: -0.5px;
      word-break: break-word;
    }
    #activeStepName a {
      color: #007aff;
      text-decoration: underline;
      cursor: pointer;
      position: relative;
      z-index: 10;
      pointer-events: auto;
    }
    #timer {
      font-size: 58px;
      font-weight: 700;
      margin: 4px 0 18px;
      color: #111;
      pointer-events: none;
    }
    .tap-hint {
      font-size: 13px;
      color: #999;
      margin-bottom: 16px;
    }
    .active-action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .skip-btn {
      flex: 1;
      padding: 14px;
      background: #f0f0f3;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      color: #555;
    }
    .back-btn {
      flex: 1;
      padding: 14px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      color: #333;
    }
    /* DIRECT ROUTINE */
    #directRoutineScreen {
      display: none;
    }
    .direct-routine-box {
      max-width: 700px;
      margin: auto;
      background: white;
      border-radius: 25px;
      padding: 30px 25px;
    }
    .direct-routine-box h1 {
      margin-top: 0;
    }
    .direct-step {
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .direct-step-image {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 10px;
    }
    /* MOBILE */
    @media (max-width: 600px) {
      .container {
        width: 94%;
        padding-top: 10px;
      }
      .main-title {
        padding: 14px 18px;
        margin-bottom: 12px;
      }
      .main-title h1 {
        font-size: 27px;
      }
      .step-grid {
        grid-template-columns: 1fr;
      }
      .disable-rule-row,
      .activation-rule-row {
        flex-direction: column;
        align-items: stretch;
      }
      #timer {
        font-size: 52px;
      }
      #activeStepName {
        font-size: 36px;
      }
      #activeRoutineName {
        font-size: 16px;
      }
      .active-step-image {
        max-height: 300px;
      }
      .top-row {
        align-items: flex-start;
        flex-direction: column;
      }
      .user-tab {
        top: 12px;
        font-size: 12px;
        padding: 8px 10px;
      }
      .active-box {
        padding-top: 12px;
      }
      .step-actions-bar {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>Routine</h1>
    <p>התחבר כדי להיכנס למערכת שלך</p>
    <button id="loginBtn" class="google-btn">כניסה עם Google</button>
  </div>
</div>
<!-- APP -->
<div id="app">
  <!-- USER SIDE TAB -->
  <button id="userTab" class="user-tab">
    <span class="user-tab-icon">☰</span>
    <span>משתמש</span>
  </button>
  <div id="userPanelOverlay" class="user-panel-overlay"></div>
  <div id="userPanel" class="user-panel">
    <button id="closeUserPanel" class="user-panel-close">×</button>
    <div class="user-panel-title">מחובר כ:</div>
    <div id="panelUserInfo"></div>
    <button id="logoutBtn" class="panel-logout">התנתק</button>
  </div>
  <div class="container">
    <!-- MAIN TITLE -->
    <div class="main-title">
      <h1>Routine</h1>
    </div>
    <!-- ROUTINE LIST -->
    <div id="routineListScreen">
      <div class="card">
        <div class="top-row">
          <h2>השגרות שלי</h2>
          <button id="newRoutineBtn" class="primary">+ Routine חדש</button>
        </div>
        <div id="routineList"></div>
      </div>
    </div>
    <!-- EDITOR -->
    <div id="editorScreen" class="hidden">
      <div class="card">
        <h2 id="editorTitle">Routine חדש</h2>
        <div class="form-group">
          <label>שם ה-Routine</label>
          <input id="routineName" type="text" placeholder="לדוגמה: בוקר">
        </div>
        <div class="form-group image-upload">
          <label>תמונה ל-Routine</label>
          <input id="routineImageInput" class="image-input" type="file" accept="image/*">
          <div id="routineImagePreview" class="image-preview"></div>
        </div>
        <div class="form-group">
          <label>באילו ימים ה-Routine פעיל?</label>
          <div class="days">
            <label class="day"><input type="checkbox" value="0"><span>א׳</span></label>
            <label class="day"><input type="checkbox" value="1"><span>ב׳</span></label>
            <label class="day"><input type="checkbox" value="2"><span>ג׳</span></label>
            <label class="day"><input type="checkbox" value="3"><span>ד׳</span></label>
            <label class="day"><input type="checkbox" value="4"><span>ה׳</span></label>
            <label class="day"><input type="checkbox" value="5"><span>ו׳</span></label>
            <label class="day"><input type="checkbox" value="6"><span>ש׳</span></label>
          </div>
        </div>
        <h2>Steps</h2>
        <div id="stepsContainer"></div>
        <div class="step-actions-bar">
          <button id="addStepBtn" class="secondary">+ צור Step חדש</button>
          <select id="reuseStepSelect">
            <option value="">-- בחר Step קיים מתוך הספרייה --</option>
          </select>
          <button id="reuseStepBtn" class="secondary">שבץ Step נבחר</button>
        </div>
        <br><br>
        <button id="saveRoutineBtn" class="primary">שמור</button>
        <button id="cancelEditorBtn" class="secondary">ביטול</button>
      </div>
    </div>
    <!-- DIRECT ROUTINE -->
    <div id="directRoutineScreen">
      <div class="direct-routine-box">
        <img id="directRoutineImage" class="direct-routine-image hidden" alt="">
        <h1 id="directRoutineName"></h1>
        <div id="directRoutineSteps"></div>
        <br>
        <button id="directStartBtn" class="primary">התחל Routine</button>
        <button id="directBackBtn" class="secondary">חזרה לשגרות</button>
      </div>
    </div>
    <!-- ACTIVE ROUTINE -->
    <div id="activeScreen">
      <div class="active-box">
        <h1 id="activeRoutineName"></h1>
        
        <div id="activeStepCard" class="active-step-card">
          <img id="activeStepImage" class="active-step-image hidden" alt="">
          <div id="activeStepName"></div>
          <div id="timer">00:00</div>
        </div>
        <div class="tap-hint">לחיצה בתוך הריבוע = בוצע</div>
        
        <div class="active-action-buttons">
          <button id="skipStepBtn" class="skip-btn">⏭ דילוג</button>
          <button id="exitActiveBtn" class="back-btn">יציאה</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCGTJFidIrp_YAuKOg2CCEO-vjFCiakkHo",
  authDomain: "site-c224f.firebaseapp.com",
  projectId: "site-c224f",
  storageBucket: "site-c224f.firebasestorage.app",
  messagingSenderId: "709702843873",
  appId: "1:709702843873:web:a326854107acb20e6ee6a0",
  measurementId: "G-GC5LS15YEC"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
let currentUser = null;
let routines = [];
let disabledStepsMap = {};
let activationRulesMap = {};
let activatedStepsMap = {}; 
let editingRoutineId = null;
let activeRoutine = null;
let activeSteps = [];
let activeStepIndex = 0;
let timerInterval = null;
let remainingSeconds = 0;
let currentRoutineImage = "";
let stepImages = new Map();
function escapeHtml(text) {
  return String(text || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function escapeAttr(text) {
  return String(text || '').replace(/"/g, "&quot;");
}
function formatTextWithLinks(text) {
  if (!text) return '';
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  const escaped = escapeHtml(text);
  return escaped.replace(urlRegex, (url) => {
    return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
  });
}
const userTab = document.getElementById("userTab");
const userPanel = document.getElementById("userPanel");
const userPanelOverlay = document.getElementById("userPanelOverlay");
const closeUserPanel = document.getElementById("closeUserPanel");
function openUserPanel() {
  userPanel.classList.add("open");
  userPanelOverlay.classList.add("show");
}
function closeUserPanelFunction() {
  userPanel.classList.remove("open");
  userPanelOverlay.classList.remove("show");
}
userTab.addEventListener("click", openUserPanel);
closeUserPanel.addEventListener("click", closeUserPanelFunction);
userPanelOverlay.addEventListener("click", closeUserPanelFunction);
document.getElementById("loginBtn").addEventListener("click", async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch (error) {
    console.error(error);
    alert("ההתחברות נכשלה:\n\n" + error.message);
  }
});
document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  closeUserPanelFunction();
});
document.getElementById("activeStepCard").addEventListener("click", (e) => {
  if (e.target.tagName === 'A' || e.target.closest('a')) {
    return;
  }
  completeActiveStep();
});
document.getElementById("skipStepBtn").addEventListener("click", () => {
  skipActiveStep();
});
onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = event => {
      const img = new Image();
      img.onload = () => {
        const maxWidth = 600;
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round(height * maxWidth / width);
          width = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.4));
      };
      img.onerror = reject;
      img.src = event.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function getDragAfterElement(container, y) {
  const draggableElements = [...container.querySelectorAll(".step:not(.dragging)")];
  return draggableElements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset: offset, element: child };
    } else {
      return closest;
    }
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}
function addStep(step = null) {

  const stepNumber = step?.stepNumber || (Math.floor(Math.random() * 9000) + 1000);
  const div = document.createElement("div");
  div.className = "step";
  div.dataset.stepId = stepId;
  div.dataset.stepNumber = stepNumber;
  if (step?.image) {
    stepImages.set(stepId, step.image);
  }
  div.innerHTML = `

      <strong>

    </div>

        <label>תדירות (כל כמה ימים)</label>
        <input class="frequency" type="number" min="1" placeholder="הכנס מספר ימים" value="${step ? (step.frequency || 1) : 1}">
      </div>
    </div>
    <div class="disable-box">
      <div class="disable-box-header">
        <strong>ביטול Steps אחרים לאחר ביצוע:</strong>
        <button type="button" class="btn-add-rule">+ הוסף כלל ביטול</button>
      </div>

      </div>
      <div class="activation-rules-container"></div>
    </div>
  `;
  div.querySelector(".remove").addEventListener("click", () => {
    stepImages.delete(stepId);
    div.remove();
  });
  // Drag & Drop
  const handle = div.querySelector(".step-drag-handle");
  handle.addEventListener("dragstart", (e) => {
    e.dataTransfer.setData("text/plain", stepId);
    e.dataTransfer.effectAllowed = "move";
    div.classList.add("dragging");
  });
  handle.addEventListener("dragend", () => {
    div.classList.remove("dragging");
  });
  div.addEventListener("dragover", (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    const dragging = document.querySelector(".step.dragging");
    if (!dragging || dragging === div) return;
    const afterElement = getDragAfterElement(container, e.clientY);
    if (afterElement == null) {
      container.appendChild(dragging);
    } else {
      container.insertBefore(dragging, afterElement);
    }
  });
  const rulesContainer = div.querySelector(".disable-rules-container");
  const addRuleBtn = div.querySelector(".btn-add-rule");
  addRuleBtn.addEventListener("click", () => {
    addDisableRuleRow(rulesContainer);
  });
  let initialRules = step?.disableRules || [];
  if (initialRules.length === 0 && step?.disableTargetId) {
    const fallbackHours = step.disableHours !== undefined ? step.disableHours : ((step.disableDays || 1) * 24);
    initialRules = [{ targetId: step.disableTargetId, hours: fallbackHours }];
  }
  initialRules.forEach(rule => {
    addDisableRuleRow(rulesContainer, rule);
  });

  const activationRulesContainer = div.querySelector(".activation-rules-container");
  const activationAddRuleBtn = div.querySelector(".activation-add-rule");
  activationAddRuleBtn.addEventListener("click", () => {
    addActivationRuleRow(activationRulesContainer);
  });

  const initialActivationRules = activationRulesMap[stepId] || step?.activationRules || [];
  initialActivationRules.forEach(rule => {
    addActivationRuleRow(activationRulesContainer, rule);
  });

  const imgInput = div.querySelector(".step-image-input");
  const imgPreview = div.querySelector(".step-image-preview");
  function renderLocalPreview() {
    imgPreview.innerHTML = "";
    const imgData = stepImages.get(stepId);
    if (!imgData) return;
    const img = document.createElement("img");
    img.src = imgData;
    const rmBtn = document.createElement("button");
    rmBtn.className = "remove-image";
    rmBtn.textContent = "🗑 מחק תמונה";
    rmBtn.addEventListener("click", () => {
      stepImages.delete(stepId);
      imgInput.value = "";
      renderLocalPreview();
    });
    imgPreview.appendChild(img);
    imgPreview.appendChild(rmBtn);
  }
  imgInput.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const base64 = await compressImage(file);
      stepImages.set(stepId, base64);
      renderLocalPreview();
    } catch (err) {
      alert("טעינת תמונה נכשלה");
    }
  });
  renderLocalPreview();
  container.appendChild(div);
}

    }

      duration: sDuration,
      frequency: sFreq,

    activeImg.classList.add("hidden");
  }
  remainingSeconds = currentStep.duration || 60;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    remainingSeconds--;
    updateTimerDisplay();
    if (remainingSeconds <= 0) {
      completeActiveStep();
    }
  }, 1000);
}
function updateTimerDisplay() {
  const m = String(Math.floor(remainingSeconds / 60)).padStart(2, '0');
  const s = String(remainingSeconds % 60).padStart(2, '0');
  document.getElementById("timer").textContent = `${m}:${s}`;
}
async function completeActiveStep() {
  const currentStep = activeSteps[activeStepIndex];
  // חישוב ביטול בעקבות ביצוע תקין (הופך ל-disabled לפי התדירות/השעות)
  let rulesToApply = [...(currentStep.disableRules || [])];
  
  if (rulesToApply.length === 0 && currentStep.disableTargetId) {
    const fallbackHours = currentStep.disableHours !== undefined ? currentStep.disableHours : ((currentStep.disableDays || 1) * 24);
    rulesToApply = [{ targetId: currentStep.disableTargetId, hours: fallbackHours }];
  }
  // הוספת ביטול עצמי לפי התדירות שהוגדרה ל-Step
  const selfFrequencyHours = (currentStep.frequency || 1) * 24;
  rulesToApply.push({ targetId: currentStep.id, hours: selfFrequencyHours });
  if (rulesToApply.length > 0) {
    const now = new Date();
    rulesToApply.forEach(rule => {
      const untilDate = new Date(now.getTime() + (rule.hours * 60 * 60 * 1000));
      disabledStepsMap[rule.targetId] = untilDate.toISOString();
    });
    try {
      const docRef = doc(db, "users", currentUser.uid, "meta", "disabledSteps");
      await setDoc(docRef, disabledStepsMap, { merge: true });
    } catch (e) {
      console.error("שגיאה בעדכון ביטול צעד ב-DB:", e);
    }
  }

  // הפעלה זמנית של Steps אחרים לפי ימים קלנדריים.
  // ההפעלה היא גלובלית לפי Step ID ולכן משפיעה על כל Routine שבו ה-Step קיים.
  const activationRules = activationRulesMap[currentStep.id] || currentStep.activationRules || [];
  if (activationRules.length > 0) {
    activationRules.forEach(rule => {
      if (!rule.targetId) return;
      const days = Math.max(1, Number(rule.days) || 1);
      const newUntil = getActivationUntilForDays(days);
      const existingUntil = activatedStepsMap[rule.targetId];
      if (!existingUntil || new Date(existingUntil) < new Date(newUntil)) {
        activatedStepsMap[rule.targetId] = newUntil;
      }
    });

    try {
      const activationDocRef = doc(db, "users", currentUser.uid, "meta", "activatedSteps");
      await setDoc(activationDocRef, activatedStepsMap, { merge: true });
    } catch (e) {
      console.error("שגיאה בעדכון הפעלת Step ב-DB:", e);
    }
  }

  activeStepIndex++;
  runStep();
}
function skipActiveStep() {
  // דילוג פשוט: עוברים לצעד הבא בלבד, ללא שמירת השלמה וללא ביטולים
  activeStepIndex++;
  runStep();
}
function exitActiveScreen() {
  if (timerInterval) clearInterval(timerInterval);
  document.getElementById("activeScreen").style.display = "none";
  document.getElementById("routineListScreen").style.display = "block";
  renderRoutines();
}
document.getElementById("exitActiveBtn").addEventListener("click", exitActiveScreen);
</script>
</body>
