<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול שגרה</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    .screen {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: 0 auto 20px auto;
    }
    .hidden {
      display: none;
    }
    .step-item {
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      background: #fafafa;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .active-display {
      text-align: center;
    }
    /* הגדלת שם השלב במסך הביצוע */
    .active-display h2 {
      font-size: 3.2em;
      font-weight: bold;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <!-- מסך עריכת השגרה (Editor) -->
  <div id="editorScreen" class="screen">
    <h2>עריכת שגרה</h2>
    <div id="stepsList"></div>
    <button onclick="addStep()">הוסף שלב</button>
    <br><br>
    <button onclick="startRoutine()" style="background-color: #28a745;">התחל שגרה</button>
  </div>

  <!-- מסך ביצוע המשימה (Active Screen) -->
  <div id="activeScreen" class="screen hidden active-display">
    <h2 id="activeStepName">שם השלב</h2>
    <p id="activeStepTimer">00:00</p>
    <button onclick="nextStep()">השלב הבא</button>
  </div>

  <script>
    let steps = [];

    // יצירת ID ייחודי לשימוש פנימי בלבד
    function generateUniqueId() {
      return 'step_' + Math.random().toString(36).substr(2, 9);
    }

    // הוספת שלב חדש
    function addStep() {
      const stepId = generateUniqueId();
      const stepIndex = steps.length + 1;

      steps.push({
        id: stepId,
        name: `שלב ${stepIndex}`
      });

      renderEditor();
    }

    // רינדור רשימת השלבים בעורך (ללא הצגת תגית ה-ID)
    function renderEditor() {
      const stepsListDiv = document.getElementById('stepsList');
      stepsListDiv.innerHTML = '';

      steps.forEach((step, index) => {
        const stepDiv = document.createElement('div');
        stepDiv.className = 'step-item';
        stepDiv.setAttribute('data-id', step.id); 
        
        stepDiv.innerHTML = `
          <strong>שלב #${index + 1}</strong>
          <div>
            <input type="text" value="${step.name}" onchange="updateStepName('${step.id}', this.value)" placeholder="שם השלב">
          </div>
        `;
        stepsListDiv.appendChild(stepDiv);
      });
    }

    // עדכון שם השלב בלוגיקה
    function updateStepName(id, newName) {
      const step = steps.find(s => s.id === id);
      if (step) {
        step.name = newName;
      }
    }

    let currentStepIndex = 0;

    // התחלת השגרה ומעבר למסך הביצוע
    function startRoutine() {
      if (steps.length === 0) {
        alert('יש להוסיף לפחות שלב אחד!');
        return;
      }
      currentStepIndex = 0;
      document.getElementById('editorScreen').classList.add('hidden');
      document.getElementById('activeScreen').classList.remove('hidden');
      showCurrentActiveStep();
    }

    // הצגת השלב הנוכחי במסך הביצוע
    function showCurrentActiveStep() {
      const currentStep = steps[currentStepIndex];
      document.getElementById('activeStepName').innerText = currentStep.name;
    }

    // מעבר לשלב הבא
    function nextStep() {
      currentStepIndex++;
      if (currentStepIndex < steps.length) {
        showCurrentActiveStep();
      } else {
        alert('כל הכבוד! סיימת את השגרה.');
        document.getElementById('activeScreen').classList.add('hidden');
        document.getElementById('editorScreen').classList.remove('hidden');
      }
    }
  </script>

</body>
</html>
