```html
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routine</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      color: #111;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 40px 30px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.08);
    }

    .login-box h1 {
      font-size: 36px;
      margin: 0 0 10px;
    }

    .login-box p {
      color: #666;
      margin-bottom: 30px;
    }

    .google-btn {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
    }

    /* APP */

    #app {
      display: none;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: auto;
      padding: 25px 0 60px;
    }

    header {
      background: white;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      margin: 0;
    }

    #userInfo {
      color: #666;
      margin-top: 5px;
      font-size: 14px;
    }

    .logout-btn {
      padding: 10px 15px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 10px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .top-row h2 {
      margin: 0;
    }

    .primary {
      background: #111;
      color: white;
      border: 0;
      padding: 12px 18px;
      border-radius: 10px;
    }

    .secondary {
      background: white;
      border: 1px solid #ddd;
      padding: 10px 15px;
      border-radius: 10px;
    }

    .danger {
      color: #d00;
      background: white;
      border: 1px solid #ddd;
      padding: 10px 15px;
      border-radius: 10px;
    }

    /* ROUTINES */

    .routine-card {
      border: 1px solid #eee;
      border-radius: 15px;
      padding: 18px;
      margin-top: 12px;
    }

    .routine-card h3 {
      margin: 0 0 7px;

    .routine-info {
      color: #777;
      font-size: 14px;

    .actions {
      display: flex;
      gap: 8px;

    .empty {
      text-align: center;

    }

    /* EDITOR */

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;

    input, select {

    .step-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .step-grid {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 12px;
    }

    .custom-days {
      display: none;
      margin-top: 10px;
    }

    /* ACTIVE */

    #activeScreen {
      display: none;
      min-height: 100vh;
      padding: 30px 15px;
    }

    .active-box {
      max-width: 600px;
      margin: auto;
      background: white;
      border-radius: 25px;
      padding: 35px 25px;
      text-align: center;
    }

    #activeStepName {
      font-size: 32px;
      margin: 35px 0 20px;
    }

    #timer {
      font-size: 65px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .done-btn {
      width: 100%;
      padding: 18px;
      background: #111;
      color: white;
      border: 0;
      border-radius: 14px;
      font-size: 20px;
    }

    .back-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      .step-grid {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
      }

      #timer {
        font-size: 52px;
      }

      #activeStepName {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

  <div class="login-box">

    <h1>Routine</h1>

    <p>התחבר כדי להיכנס למערכת שלך</p>

    <button id="loginBtn" class="google-btn">
      כניסה עם Google
    </button>

  </div>

</div>


<!-- MAIN APP -->

<div id="app">

  <div class="container">

    <header>

      <div>
        <h1>Routine</h1>
        <div id="userInfo"></div>
      </div>

      <button id="logoutBtn" class="logout-btn">
        התנתק
      </button>

    </header>


    <!-- ROUTINE LIST -->

    <div id="routineListScreen">

      <div class="card">

        <div class="top-row">

          <h2>השגרות שלי</h2>

          <button id="newRoutineBtn" class="primary">
            + Routine חדש
          </button>

        </div>

        <div id="routineList"></div>

      </div>

    </div>


    <!-- EDITOR -->

    <div id="editorScreen" class="hidden">

      <div class="card">

        <h2 id="editorTitle">
          Routine חדש
        </h2>

        <div class="form-group">

          <label>שם ה-Routine</label>

          <input
            id="routineName"
            placeholder="לדוגמה: בוקר"
          >

        </div>


        <div class="form-group">

          <label>באילו ימים ה-Routine פעיל?</label>

          <div class="days">

            <label class="day">
              <input type="checkbox" value="0">
              <span>א׳</span>
            </label>

            <label class="day">
              <input type="checkbox" value="1">
              <span>ב׳</span>
            </label>

            <label class="day">
              <input type="checkbox" value="2">
              <span>ג׳</span>
            </label>

            <label class="day">
              <input type="checkbox" value="3">
              <span>ד׳</span>
            </label>

            <label class="day">
              <input type="checkbox" value="4">
              <span>ה׳</span>
            </label>

            <label class="day">
              <input type="checkbox" value="5">
              <span>ו׳</span>
            </label>

            <label class="day">
              <input type="checkbox" value="6">
              <span>ש׳</span>
            </label>

          </div>

        </div>


        <h2>Steps</h2>

        <div id="stepsContainer"></div>

        <button id="addStepBtn" class="secondary">
          + הוסף Step
        </button>

        <br><br>

        <button id="saveRoutineBtn" class="primary">
          שמור
        </button>

        <button id="cancelEditorBtn" class="secondary">
          ביטול
        </button>

      </div>

    </div>


    <!-- ACTIVE ROUTINE -->

    <div id="activeScreen">

      <div class="active-box">

        <h1 id="activeRoutineName"></h1>

        <div id="activeStepName"></div>

        <div id="timer">00:00</div>

        <button id="doneStepBtn" class="done-btn">
          ✓ בוצע
        </button>

        <button id="exitActiveBtn" class="back-btn">
          יציאה
        </button>

      </div>

    </div>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* FIREBASE */

  const firebaseConfig = {

    apiKey: "AIzaSyCGTJFidIrp_YAuKOg2CCEO-vjFCiakkHo",

    authDomain: "site-c224f.firebaseapp.com",

    projectId: "site-c224f",

    storageBucket: "site-c224f.firebasestorage.app",

    messagingSenderId: "709702843873",

    appId: "1:709702843873:web:a326854107acb20e6ee6a0",

    measurementId: "G-GC5LS15YEC"

  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);

  const provider = new GoogleAuthProvider();


  /* VARIABLES */

  let currentUser = null;

  let routines = [];

  let editingRoutineId = null;

  let activeRoutine = null;

  let activeStepIndex = 0;

  let timerInterval = null;

  let remainingSeconds = 0;


  /* ELEMENTS */

  const loginScreen =
    document.getElementById("loginScreen");

  const appScreen =
    document.getElementById("app");

  const routineListScreen =
    document.getElementById("routineListScreen");

  const editorScreen =
    document.getElementById("editorScreen");

  const activeScreen =
    document.getElementById("activeScreen");


  /* LOGIN */

  document
    .getElementById("loginBtn")
    .addEventListener("click", async () => {

      try {

        await signInWithPopup(
          auth,
          provider
        );

      } catch (error) {

        console.error(error);

        alert(
          "ההתחברות נכשלה:\n\n" +
          error.message
        );

      }

    });


  /* LOGOUT */

  document
    .getElementById("logoutBtn")
    .addEventListener("click", async () => {

      await signOut(auth);

    });


  /* AUTH */

  onAuthStateChanged(
    auth,
    async (user) => {

      if (user) {

        currentUser = user;

        loginScreen.style.display = "none";

        appScreen.style.display = "block";

        document.getElementById("userInfo").textContent =
          user.displayName || user.email;

        await loadRoutines();

      } else {

        currentUser = null;

        loginScreen.style.display = "flex";

        appScreen.style.display = "none";

      }

    }
  );


  /* LOAD ROUTINES */

  async function loadRoutines() {

    const list =
      document.getElementById("routineList");

    list.innerHTML = "טוען...";

    try {

      const ref =
        collection(
          db,
          "users",
          currentUser.uid,
          "routines"
        );

      const snapshot =
        await getDocs(ref);

      routines = [];

      snapshot.forEach(item => {

        routines.push({

          id: item.id,

          ...item.data()

        });

      });

      renderRoutines();

    } catch (error) {

      console.error(error);

      list.innerHTML = `
        <div class="empty">
          לא ניתן לטעון את השגרות.<br><br>
          ודא ש-Firestore מופעל ב-Firebase.
        </div>
      `;

    }

  }


  /* RENDER */

  function renderRoutines() {

    const list =
      document.getElementById("routineList");

    list.innerHTML = "";

    if (routines.length === 0) {

      list.innerHTML = `
        <div class="empty">
          עדיין אין לך שגרות.<br>
          לחץ על "+ Routine חדש" כדי ליצור אחת.
        </div>
      `;

      return;

    }


    routines.forEach(routine => {

      const card =
        document.createElement("div");

      card.className = "routine-card";

      const stepCount =
        routine.steps
          ? routine.steps.length
          : 0;


      card.innerHTML = `

        <h3>
          ${escapeHtml(routine.name)}
        </h3>

        <div class="routine-info">
          ${stepCount} Steps
        </div>

        <div class="actions">

          <button class="primary start">
            התחל
          </button>

          <button class="secondary edit">
            ערוך
          </button>

          <button class="danger delete">
            מחק
          </button>

        </div>

      `;


      card
        .querySelector(".start")
        .addEventListener(
          "click",
          () => startRoutine(routine)
        );


      card
        .querySelector(".edit")
        .addEventListener(
          "click",
          () => openEditor(routine)
        );


      card
        .querySelector(".delete")
        .addEventListener(
          "click",
          () => deleteRoutine(routine.id)
        );


      list.appendChild(card);

    });

  }


  /* NEW */

  document
    .getElementById("newRoutineBtn")
    .addEventListener(
      "click",
      () => openEditor(null)
    );


  /* EDITOR */

  function openEditor(routine) {

    routineListScreen.style.display = "none";

    editorScreen.classList.remove("hidden");

    editingRoutineId =
      routine ? routine.id : null;


    document.getElementById("editorTitle").textContent =
      routine ? "עריכת Routine" : "Routine חדש";


    document.getElementById("routineName").value =
      routine ? routine.name : "";


    document
      .querySelectorAll(".days input")
      .forEach(box => {

        box.checked =
          routine
            ? (routine.days || []).includes(
                Number(box.value)
              )
            : false;

      });


    document.getElementById("stepsContainer").innerHTML = "";


    if (routine && routine.steps) {

      routine.steps.forEach(step => {

        addStep(step);

      });

    }

  }


  /* ADD STEP */

  document
    .getElementById("addStepBtn")
    .addEventListener(
      "click",
      () => addStep()
    );


  function addStep(step = null) {

    const container =
      document.getElementById("stepsContainer");

    const div =
      document.createElement("div");

    div.className = "step";


    div.innerHTML = `

      <div class="step-title">

        <strong>
          Step ${container.children.length + 1}
        </strong>

        <button class="danger remove">
          מחק
        </button>

      </div>


      <div class="form-group">

        <label>שם ה-Step</label>

        <input
          class="step-name"
          value="${step ? escapeHtml(step.name) : ""}"
          placeholder="לדוגמה: לשתות מים"
        >

      </div>


      <div class="step-grid">

        <div>

          <label>משך בשניות</label>

          <input
            class="step-duration"
            type="number"
            min="1"
            value="${step ? step.duration : 60}"
          >

        </div>


        <div>

          <label>תדירות</label>

          <select class="frequency">

            <option value="daily">
              כל יום
            </option>

            <option value="2">
              כל יומיים
            </option>

            <option value="3">
              כל 3 ימים
            </option>

            <option value="7">
              כל 7 ימים
            </option>

            <option value="custom">
              כל X ימים
            </option>

          </select>

        </div>

      </div>


      <div class="custom-days">

        <label>כל כמה ימים?</label>

        <input
          class="custom-value"
          type="number"
          min="1"
          value="2"
        >

      </div>

    `;


    container.appendChild(div);


    const frequency =
      div.querySelector(".frequency");

    const custom =
      div.querySelector(".custom-days");


    if (step) {

      if (
        step.frequency === "daily" ||
        step.frequency === "2" ||
        step.frequency === "3" ||
        step.frequency === "7"
      ) {

        frequency.value =
          step.frequency;

      } else {

        frequency.value = "custom";

        custom.style.display = "block";

        div.querySelector(".custom-value").value =
          step.frequency || 2;

      }

    }


    frequency.addEventListener(
      "change",
      () => {

        custom.style.display =
          frequency.value === "custom"
            ? "block"
            : "none";

      }
    );


    div
      .querySelector(".remove")
      .addEventListener(
        "click",
        () => {

          div.remove();

          renumberSteps();

        }
      );

  }


  /* RENUMBER */

  function renumberSteps() {

    document
      .querySelectorAll(".step")
      .forEach((step, index) => {

        step.querySelector("strong").textContent =
          "Step " + (index + 1);

      });

  }


  /* SAVE */

  document
    .getElementById("saveRoutineBtn")
    .addEventListener(
      "click",
      saveRoutine
    );


  async function saveRoutine() {

    const name =
      document
        .getElementById("routineName")
        .value
        .trim();


    if (!name) {

      alert("כתוב שם ל-Routine.");

      return;

    }


    const days =
      [...document.querySelectorAll(".days input:checked")]
        .map(box => Number(box.value));


    const steps = [];


    document
      .querySelectorAll(".step")
      .forEach((div, index) => {

        const stepName =
          div.querySelector(".step-name")
            .value
            .trim();


        if (!stepName) return;


        const duration =
          Number(
            div.querySelector(".step-duration").value
          );


        const frequency =
          div.querySelector(".frequency").value;


        let finalFrequency = frequency;


        if (frequency === "custom") {

          finalFrequency =
            div.querySelector(".custom-value").value;

        }


        steps.push({

          name: stepName,

          duration: duration > 0 ? duration : 60,

          frequency: finalFrequency,

          order: index

        });

      });


    const data = {

      name,

      days,

      steps,

      updatedAt: new Date().toISOString()

    };


    try {

      const ref =
        collection(
          db,
          "users",
          currentUser.uid,
          "routines"
        );


      if (editingRoutineId) {

        await updateDoc(

          doc(
            db,
            "users",
            currentUser.uid,
            "routines",
            editingRoutineId
          ),

          data

        );

      } else {

        await addDoc(ref, data);

      }


      closeEditor();

      await loadRoutines();

    } catch (error) {

      console.error(error);

      alert(
        "השמירה נכשלה:\n\n" +
        error.message
      );

    }

  }


  /* CLOSE EDITOR */

  document
    .getElementById("cancelEditorBtn")
    .addEventListener(
      "click",
      closeEditor
    );


  function closeEditor() {

    editorScreen.classList.add("hidden");

    routineListScreen.style.display = "block";

    editingRoutineId = null;

  }


  /* DELETE */

  async function deleteRoutine(id) {

    if (!confirm("למחוק את ה-Routine?")) {
      return;
    }


    try {

      await deleteDoc(

        doc(
          db,
          "users",
          currentUser.uid,
          "routines",
          id
        )

      );


      await loadRoutines();

    } catch (error) {

      console.error(error);

      alert("המחיקה נכשלה.");

    }

  }


  /* START */

  function startRoutine(routine) {

    if (
      !routine.steps ||
      routine.steps.length === 0
    ) {

      alert(
        "ל-Routine הזה אין Steps."
      );

      return;

    }


    activeRoutine = routine;

    activeStepIndex = 0;


    routineListScreen.style.display = "none";

    editorScreen.classList.add("hidden");

    activeScreen.style.display = "block";


    document
      .getElementById("activeRoutineName")
      .textContent =
      routine.name;


    showStep();

  }


  /* STEP */

  function showStep() {

    clearInterval(timerInterval);


    if (
      activeStepIndex >=
      activeRoutine.steps.length
    ) {

      alert("ה-Routine הושלם!");

      exitRoutine();

      return;

    }


    const step =
      activeRoutine.steps[activeStepIndex];


    document
      .getElementById("activeStepName")
      .textContent =
      step.name;


    remainingSeconds =
      Number(step.duration);


    updateTimer();


    timerInterval =
      setInterval(() => {

        remainingSeconds--;

        updateTimer();


        if (remainingSeconds <= 0) {

          clearInterval(timerInterval);

        }

      }, 1000);

  }


  /* TIMER */

  function updateTimer() {

    const minutes =
      Math.floor(
        remainingSeconds / 60
      );

    const seconds =
      remainingSeconds % 60;


    document
      .getElementById("timer")
      .textContent =
      String(minutes).padStart(2, "0") +
      ":" +
      String(seconds).padStart(2, "0");

  }


  /* DONE */

  document
    .getElementById("doneStepBtn")
    .addEventListener(
      "click",
      () => {

        activeStepIndex++;

        showStep();

      }
    );


  /* EXIT */

  document
    .getElementById("exitActiveBtn")
    .addEventListener(
      "click",
      exitRoutine
    );


  function exitRoutine() {

    clearInterval(timerInterval);

    activeScreen.style.display = "none";

    routineListScreen.style.display = "block";

    activeRoutine = null;

  }


  /* HELPERS */

  function escapeHtml(text) {

    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
```
