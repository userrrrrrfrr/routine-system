<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routine</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      color: #111;
    }
    button,
    input,
    select {
      font: inherit;
    }
    button {
      cursor: pointer;
    }
    .hidden {
      display: none !important;
    }
    /* =========================
       LOGIN
    ========================= */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 40px 30px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.08);
    }
    .login-box h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }
    .login-box p {
      color: #666;
      margin-bottom: 30px;
    }
    .google-btn {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: white;
    }
    /* =========================
       APP
    ========================= */
    #app {
      display: none;
    }
    .container {
      width: 92%;
      max-width: 900px;
      margin: auto;
      padding: 10px 0 60px; /* הקטנת המרווח העליון של האתר */
    }
    
    /* עדכון ה-Header: קטן יותר, מוזז לשמאל ומעלה את שאר האתר */
    header {
      background: white;
      padding: 10px 15px; /* הקטנת הפדינג */
      border-radius: 15px;
      margin-bottom: 10px; /* הקטנת המרווח התחתון */
      display: flex;
      flex-direction: row-reverse; /* הופך את הסדר ומציב את הכותרת בימין והכפתור בשמאל */
      justify-content: flex-end; /* מצמיד את הכל לצד שמאל של המסך */
      align-items: center;
      gap: 15px;
    }
    header h1 {
      margin: 0;
      font-size: 20px; /* הקטנת גודל גופן הכותרת */
    }
    #userInfo {
      color: #666;
      margin-top: 2px;
      font-size: 12px; /* הקטנת גופן שם המשתמש */
    }
    .logout-btn {
      padding: 6px 12px; /* הקטנת כפתור ההתנתק */
      border: 1px solid #ddd;
      background: white;
      border-radius: 8px;
      font-size: 13px;
    }
    
    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    .top-row h2 {
      margin: 0;
    }
    .primary {
      background: #111;
      color: white;
      border: 0;
      padding: 12px 18px;
      border-radius: 10px;
    }
    .secondary {
      background: white;
      border: 1px solid #ddd;
      padding: 10px 15px;
      border-radius: 10px;
    }
    .danger {
      color: #d00;
      background: white;
      border: 1px solid #ddd;
      padding: 10px 15px;
      border-radius: 10px;
    }
    /* =========================
       IMAGE UPLOAD
    ========================= */
    .image-upload {
      margin-top: 10px;
    }
    .image-upload label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .image-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
    }
    .image-preview {
      margin-top: 12px;
      position: relative;
    }
    .image-preview img {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      background: #f5f5f7;
      border-radius: 15px;
      border: 1px solid #eee;
      display: block;
    }
    .remove-image {
      margin-top: 8px;
      padding: 8px 12px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 8px;
      color: #d00;
    }
    .routine-image {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      background: #f5f5f7;
      border-radius: 15px;
      margin-bottom: 15px;
      display: block;
    }
    .direct-routine-image {
      width: 100%;
      max-height: 340px;
      object-fit: contain;
      background: #f5f5f7;
      border-radius: 18px;
      margin-bottom: 20px;
    }
    .active-step-image {
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      background: #f5f5f7;
      border-radius: 18px;
      margin: 20px 0;
      display: block;
    }
    /* =========================
       ROUTINES
    ========================= */
    .routine-card {
      border: 1px solid #eee;
      border-radius: 15px;
      padding: 18px;
      margin-top: 12px;
    }
    .routine-card h3 {
      margin: 0 0 7px;
    }
    .routine-info {
      color: #777;
      font-size: 14px;
      margin-bottom: 15px;
      line-height: 1.7;
    }
    .today-info {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: #f5f5f7;
      font-size: 14px;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .empty {
      text-align: center;
      color: #777;
      padding: 35px 10px;
    }
    /* =========================
       FORM
    ========================= */
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }
    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
    }
    .days {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .day input {
      display: none;
    }
    .day span {
      display: block;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
    }
    .day input:checked + span {
      background: #111;
      color: white;
    }
    /* =========================
       STEPS
    ========================= */
    .step {
      border: 1px solid #eee;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 12px;
    }
    .step-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .step-grid {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 12px;
    }
    .custom-days {
      display: none;
      margin-top: 12px;
    }
    .step-start-date {
      margin-top: 15px;
    }
    .step-start-date label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }
    .step-start-date small {
      display: block;
      color: #777;
      margin-top: 6px;
    }
    /* =========================
       ACTIVE ROUTINE
    ========================= */
    #activeScreen {
      display: none;
      min-height: 100vh;
      padding: 30px 15px;
      cursor: pointer; /* אינדיקציה שהמסך כולו לחיץ */
    }
    .active-box {
      max-width: 600px;
      margin: auto;
      background: white;
      border-radius: 25px;
      padding: 35px 25px;
      text-align: center;
    }
    
    /* הגדלת ה-Steps (שם הצעד) במסך הפעיל */
    #activeStepName {
      font-size: 54px; /* הגדלה מ-42px */
      font-weight: bold;
      color: #d00;
      margin: 30px 0 20px;
      line-height: 1.3;
    }
    /* הגדלת הטיימר שיתאים לגודל החדש */
    #timer {
      font-size: 80px; /* הגדלה מ-65px */
      font-weight: bold;
      margin-bottom: 30px;
    }
    .done-btn {
      width: 100%;
      padding: 18px;
      background: #111;
      color: white;
      border: 0;
      border-radius: 14px;
      font-size: 20px;
    }
    .back-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
    }
    /* =========================
       DIRECT ROUTINE
    ========================= */
    #directRoutineScreen {
      display: none;
    }
    .direct-routine-box {
      max-width: 700px;
      margin: auto;
      background: white;
      border-radius: 25px;
      padding: 30px 25px;
    }
    .direct-routine-box h1 {
      margin-top: 0;
    }
    .direct-step {
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .direct-step strong {
      color: #d00;
      font-size: 18px;
    }
    .direct-step-name {
      color: #d00;
      font-size: 22px;
      font-weight: bold;
      display: block;
      margin-top: 4px;
    }
    .direct-step-image {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      background: #f5f5f7;
    }
  </style>
</head>
<body>

  <!-- כאן יבוא שאר ה-HTML של האפליקציה שלך -->

  <script>
    // הוספת פונקציונליות: לחיצה על כל מקום במסך הפעיל מפעילה את כפתור ה"בוצע"
    document.getElementById('activeScreen').addEventListener('click', function(e) {
      // מונע הפעלה כפולה אם המשתמש לחץ ספציפית על כפתור החזרה ("הקודם" וכדומה)
      if (e.target.classList.contains('back-btn')) {
        return;
      }
      
      // כאן יש לקרוא לפונקציה שמקדמת את הצעד (למשל הפונקציה שמופעלת בלחיצה על .done-btn)
      // דוגמה קלאסית בהנחה שיש לך פונקציה קיימת בשם nextStep:
      if (typeof nextStep === "function") {
        nextStep();
      } else {
        // או סימולציה של לחיצה על כפתור הבוצע הקיים:
        const doneBtn = document.querySelector('.done-btn');
        if (doneBtn) doneBtn.click();
      }
    });
  </script>
</body>
</html>
